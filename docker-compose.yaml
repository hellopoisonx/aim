services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: .
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-auth
    ports:
      - "8989:8989"
    volumes:
      - ./app/auth/rpc/etc/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./app/auth/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h postgres -U user -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_auth'" | grep -q 1 || psql -h postgres -U user -d postgres -c "CREATE DATABASE aim_auth"
        psql -h postgres -U user -d aim_auth -f /migrations/000_init.sql
        psql -h postgres -U user -d aim_auth -f /migrations/001_require_user_name.sql
    networks:
      - aim-network

  aim-gateway:
    build:
      context: .
      dockerfile: app/gateway/Dockerfile
    container_name: aim-gateway
    ports:
      - "8888:8888"  # REST API
      - "9090:9090"  # gRPC
    environment:
      AIM_GATEWAY_NODE_ID: 0
    volumes:
      - ./app/gateway/api/etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  aim-logic:
    build:
      context: .
      dockerfile: app/logic/rpc/Dockerfile
    container_name: aim-logic
    volumes:
      - ./app/logic/rpc/etc/logic.yaml:/app/etc/logic.yaml:ro
      - logic_log:/app/log
    depends_on:
      logic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  logic-migrate:
    image: postgres:17-alpine
    container_name: aim-logic-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./app/logic/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h postgres -U user -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_logic'" | grep -q 1 || psql -h postgres -U user -d postgres -c "CREATE DATABASE aim_logic"
        psql -h postgres -U user -d aim_logic -f /migrations/000_extensions.sql
        psql -h postgres -U user -d aim_logic -f /migrations/001_initial_permission.sql
        psql -h postgres -U user -d aim_logic -f /migrations/002_messages.sql
        psql -h postgres -U user -d aim_logic -f /migrations/003_user_info.sql
        psql -h postgres -U user -d aim_logic -f /migrations/004_group_management.sql
        psql -h postgres -U user -d aim_logic -f /migrations/005_conversation_read_states.sql
        psql -h postgres -U user -d aim_logic -f /migrations/006_user_type.sql
        psql -h postgres -U user -d aim_logic -f /migrations/007_bot_tokens.sql
        psql -h postgres -U user -d aim_logic -f /migrations/008_bot_webhooks.sql
    networks:
      - aim-network

  aim-core:
    build:
      context: .
      dockerfile: app/core/rpc/Dockerfile
    container_name: aim-core
    ports:
      - "8081:8080"
    volumes:
      - ./app/core/rpc/etc/core.yaml:/app/etc/core.yaml:ro
      - core_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
      aim-logic:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aim_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aim_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  kafka:
    image: apache/kafka:4.0.2
    container_name: aim-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aim-network

  kafbat-ui:
     container_name: kafbat-ui
     image: ghcr.io/kafbat/kafka-ui:latest
     ports:
       - 8000:8080
     environment:
       DYNAMIC_CONFIG_ENABLED: 'true'
       SWAGGER_UI_ENABLED: 'true'
     depends_on:
       kafka:
           condition: service_healthy
     volumes:
       - ./kui/config.yaml:/etc/kafkaui/dynamic_config.yaml:ro
     networks:
       - aim-network

  kafka-init:
    image: apache/kafka:4.0.2
    container_name: aim-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.user.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim-message-transfer --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.conversation.events --partitions 3 --replication-factor 1
    networks:
      - aim-network

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aim-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # Nacos 主端口
      - "9848:9848"   # 必须暴露：客户端 gRPC 请求服务端口
      - "9849:9849"   # 必须暴露：服务端 gRPC 内部通信端口
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      # 修正健康检查路径，Nacos 默认带 /nacos/index.html
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Observability ====================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC receiver
      - "4318:4318"      # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  nacos_data:
  nacos_logs:
  gateway_log:
  auth_log:
  logic_log:
  core_log:
