services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: .
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-auth
    ports:
      - "8989:8989"
    volumes:
      - ./app/auth/rpc/etc/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./app/auth/rpc/model/schema.sql:/schema.sql:ro
    command: ["sh", "-c", "psql -h postgres -U user -d aim_auth -f /schema.sql"]
    networks:
      - aim-network

  aim-gateway:
    build:
      context: .
      dockerfile: app/gateway/Dockerfile
    container_name: aim-gateway
    ports:
      - "8888:8888"  # REST API
      - "9090:9090"  # gRPC
    volumes:
      - ./app/gateway/api/etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aim_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aim_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  kafka:
    image: apache/kafka:4.0.2
    container_name: aim-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aim-network

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aim-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # Nacos 主端口
      - "9848:9848"   # 必须暴露：客户端 gRPC 请求服务端口
      - "9849:9849"   # 必须暴露：服务端 gRPC 内部通信端口
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      # 修正健康检查路径，Nacos 默认带 /nacos/index.html
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Observability ====================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC receiver
      - "4318:4318"      # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  nacos_data:
  nacos_logs:
  gateway_log:
  auth_log:
