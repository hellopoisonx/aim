Name: auth.rpc
ListenOn: 0.0.0.0:8989
Prometheus:
  Host: 0.0.0.0
  Port: 9192
  Path: /metrics
Telemetry:
  Name: auth.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - etcd:2379
  Key: auth.rpc
Postgres:
  DataSource: postgres://user:password@postgres:5432/aim_auth?sslmode=disable
SessionRedis:
  Host: redis:6379
  Pass: ""
Token:
  AccessSecret: aim-dev-access-secret
  AccessTTL: 5m
  RefreshTTL: 168h
  SnowflakeMachineID: 1
KqPusherConf:
  Brokers:
    - kafka:9092
  Topic: aim.user.events
