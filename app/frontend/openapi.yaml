openapi: "3.0.3"
info:
  title: "AIM Gateway API"
  description: |
    AIM 即时通讯系统网关对外 REST 接口。

    所有响应统一采用 JSON 信封格式：

    - 成功：`{"code": 0, "msg": "ok", "body": { ... }}`
    - 错误：`{"code": <biz_code>, "msg": "<error_message>"}`

    业务错误码分类（code / 100 映射为 HTTP 状态码）：

    | 范围      | HTTP 状态     |
    |-----------|---------------|
    | 40xxx     | 400 Bad Request |
    | 401xx     | 401 Unauthorized |
    | 403xx     | 403 Forbidden    |
    | 404xx     | 404 Not Found    |
    | 409xx     | 409 Conflict     |
    | 429xx     | 429 Too Many Requests |
    | 50xxx     | 500 Internal Server Error |

    **鉴权**：WebSocket 升级和受保护 REST 端点通过 HTTP Header `Authorization: Bearer <access_token>` 进行 JWT 鉴权。
  version: "1.0.0"
servers:
  - url: http://localhost:8888
    description: 本地开发
paths:
  # ============================================================
  # Auth — 无需鉴权
  # ============================================================
  /api/auth/register:
    post:
      tags: ["Auth"]
      summary: 用户注册
      operationId: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: 用户登录
      operationId: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/refresh:
    post:
      tags: ["Auth"]
      summary: 刷新 Token
      operationId: RefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/auth/logout:
    post:
      tags: ["Auth"]
      summary: 用户注销
      operationId: Logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 注销成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ============================================================
  # Users — 需鉴权
  # ============================================================
  /api/users/by-name/{name}:
    get:
      tags: ["Users"]
      summary: 按用户名搜索用户
      operationId: GetUserByName
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: 用户名
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/GetUserByNameResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/users/by-id/{id}:
    get:
      tags: ["Users"]
      summary: 按 ID 获取用户详情
      operationId: GetUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 用户 ID
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/GetUserByIdResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/users/friends/{id}:
    post:
      tags: ["Users"]
      summary: 添加好友
      operationId: AddFriend
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 目标用户 ID
      responses:
        "200":
          description: 添加成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/AddFriendResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ============================================================
  # Conversations — 需鉴权
  # ============================================================
  /api/conversations:
    post:
      tags: ["Conversations"]
      summary: 创建会话
      operationId: CreateConversation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/CreateConversationResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: ["Conversations"]
      summary: 获取会话列表
      operationId: ListConversations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/ListConversationsResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/conversations/history/{id}:
    get:
      tags: ["Conversations"]
      summary: 获取会话历史消息（游标分页）
      operationId: GetConversationHistory
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 会话 ID
        - name: cursor_created_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 游标时间戳（毫秒），分页起点
        - name: cursor_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 游标消息 ID，配合 cursor_created_at 使用
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/GetConversationHistoryResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ============================================================
  # Friends — 需鉴权
  # ============================================================
  /api/friends/applications:
    get:
      tags: ["Friends"]
      summary: 获取好友申请列表
      operationId: ListFriendApplications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/ListFriendApplicationsResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/friends/me:
    get:
      tags: ["Friends"]
      summary: 获取好友列表
      operationId: ListFriends
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/ListFriendsResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/friends/accept/{id}:
    post:
      tags: ["Friends"]
      summary: 接受好友申请
      operationId: AcceptFriend
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友申请记录 ID
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/AcceptFriendResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/friends/reject/{id}:
    post:
      tags: ["Friends"]
      summary: 拒绝好友申请
      operationId: RejectFriend
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 好友申请记录 ID
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - properties:
                      body:
                        $ref: "#/components/schemas/RejectFriendResponse"
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ============================================================
  # WebSocket 升级端点
  # ============================================================
  /ws:
    get:
      tags: ["WebSocket"]
      summary: WebSocket 升级端点
      description: |
        通过 HTTP Upgrade 建立 WebSocket 持久连接。

        - 需要 JWT `access_token` 通过 `Authorization: Bearer <token>` Header 传递
        - 升级后所有通信使用 Protobuf 二进制帧（详见 ws.md）
        - 帧协议定义参考 `shared/proto/ws/ws.proto`

        连接生命周期：
        1. 客户端携带 JWT 发起 HTTP Upgrade 请求
        2. 网关验证 JWT，升级为 WebSocket 连接
        3. 双方通过二进制 WsFrame 通信
        4. 客户端应定期发送 HEARTBEAT 保活
        5. Token 过期时网关推送 TOKEN_EXPIRED 帧并关闭连接
      operationId: WebSocketConnect
      security:
        - BearerAuth: []
      responses:
        "101":
          description: 切换协议成功，后续为 WebSocket 二进制帧通信
        "401":
          description: Token 无效或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 通过 `/api/auth/login` 或 `/api/auth/refresh` 获取的 JWT access_token

  schemas:
    # ------------------------------------------------------------
    # 统一响应信封
    # ------------------------------------------------------------
    ResponseEnvelope:
      type: object
      required: [code, msg, body]
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
          example: ok
        body:
          type: object

    ErrorEnvelope:
      type: object
      required: [code, msg]
      properties:
        code:
          type: integer
          description: 业务错误码
        msg:
          type: string
          description: 错误描述

    # ------------------------------------------------------------
    # Auth
    # ------------------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, device_id]
      properties:
        email:
          type: string
          format: email
          description: 注册邮箱
        password:
          type: string
          minLength: 8
          description: 密码（至少8位）
        username:
          type: string
          description: 用户名（可选）
        avatar:
          type: string
          description: 头像 URL（可选）
        device_id:
          type: string
          description: 设备唯一标识

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 新用户 ID

    LoginRequest:
      type: object
      required: [email, password, device_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        device_id:
          type: string

    LoginResponse:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        access_token:
          type: string
          description: JWT 访问令牌（用于后续鉴权）
        refresh_token:
          type: string
          description: 刷新令牌
        expires_at:
          type: integer
          format: int64
          description: 过期时间戳（秒）

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: integer
          format: int64

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean

    # ------------------------------------------------------------
    # Users
    # ------------------------------------------------------------
    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        status:
          type: integer
          description: 用户状态
        nickname:
          type: string
        avatar:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    UserListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        avatar:
          type: string

    GetUserByNameResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"

    GetUserByIdResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"

    FriendshipItem:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
          description: 申请人用户 ID
        friend_id:
          type: integer
          format: int64
          description: 被申请人用户 ID
        status:
          type: string
          description: 好友关系状态
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    AddFriendResponse:
      type: object
      properties:
        friendship:
          $ref: "#/components/schemas/FriendshipItem"

    # ------------------------------------------------------------
    # Conversations
    # ------------------------------------------------------------
    CreateConversationRequest:
      type: object
      required: [conversation_type, member_ids]
      properties:
        conversation_type:
          type: string
          enum: [direct, group]
          description: 会话类型
        member_ids:
          type: array
          items:
            type: integer
            format: int64
          minItems: 1
          description: 成员用户 ID 列表

    CreateConversationResponse:
      type: object
      properties:
        conversation_id:
          type: integer
          format: int64
        conversation_type:
          type: string
        is_active:
          type: boolean
        created_at:
          type: integer
          format: int64
        member_ids:
          type: array
          items:
            type: integer
            format: int64

    ConversationItem:
      type: object
      properties:
        conversation_id:
          type: integer
          format: int64
        conversation_type:
          type: string
        is_active:
          type: boolean
        created_at:
          type: integer
          format: int64
        member_ids:
          type: array
          items:
            type: integer
            format: int64

    ListConversationsResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationItem"

    MessageItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        sender_id:
          type: integer
          format: int64
        message_type:
          type: string
        content:
          type: string
        client_msg_id:
          type: string
        created_at:
          type: integer
          format: int64

    GetConversationHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageItem"
        next_cursor_created_at:
          type: integer
          format: int64
        next_cursor_id:
          type: integer
          format: int64
        has_more:
          type: boolean

    # ------------------------------------------------------------
    # Friends
    # ------------------------------------------------------------
    ListFriendApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: "#/components/schemas/FriendshipItem"

    ListFriendsResponse:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: "#/components/schemas/FriendshipItem"

    AcceptFriendResponse:
      type: object
      properties:
        friendship:
          $ref: "#/components/schemas/FriendshipItem"

    RejectFriendResponse:
      type: object
      properties:
        friendship:
          $ref: "#/components/schemas/FriendshipItem"
