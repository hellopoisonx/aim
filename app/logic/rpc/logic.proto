syntax = "proto3";

package logic;

option go_package = "./pb";

service PermissionService {
  // CheckMessagePermission checks whether a sender can publish into a conversation.
  // aim-core calls this before accepting a message into Kafka.
  rpc CheckMessagePermission(CheckMessagePermissionReq) returns (CheckMessagePermissionResp);
}

service UserService {
  // CreateUserInfo creates a new user profile.
  rpc CreateUserInfo(CreateUserInfoReq) returns (CreateUserInfoResp);
  // GetUserInfo retrieves a user profile by ID.
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);
  // GetUserInfoByEmail retrieves a user profile by email.
  rpc GetUserInfoByEmail(GetUserInfoByEmailReq) returns (GetUserInfoResp);
  // GetUserInfoByNickname retrieves a user profile by exact nickname.
  rpc GetUserInfoByNickname(GetUserInfoByNicknameReq) returns (GetUserInfoResp);
  // UpdateUserInfoProfile updates nickname and avatar.
  rpc UpdateUserInfoProfile(UpdateUserInfoProfileReq) returns (UpdateUserInfoProfileResp);
  // UpdateUserInfoStatus updates user status.
  rpc UpdateUserInfoStatus(UpdateUserInfoStatusReq) returns (UpdateUserInfoStatusResp);
  // SearchUserInfoByNickname searches user profiles by nickname prefix.
  rpc SearchUserInfoByNickname(SearchUserInfoByNicknameReq) returns (SearchUserInfoByNicknameResp);
}

// PermissionService messages

message CheckMessagePermissionReq {
  int64 sender_id = 1;
  int64 conversation_id = 2;
  // message_type must be a short client-supported type such as text/image/file/voice/video.
  string message_type = 3;
  // mentions is capped by the logic service before policy evaluation.
  repeated int64 mentions = 4;
}

message CheckMessagePermissionResp {
  bool allowed = 1;
  int32 biz_code = 2;
  string reason = 3;
  repeated int64 filtered_mentions = 4; // mentions filtered to conversation members only
}


// UserService messages

message UserInfoResponse {
  int64 id = 1;
  string email = 2;
  int32 status = 3;
  string nickname = 4;
  string avatar = 5;
  int64 created_at = 6;  // unix timestamp
  int64 updated_at = 7;  // unix timestamp
}

message CreateUserInfoReq {
  int64 id = 1;
  string email = 2;
  string nickname = 3;
  string avatar = 4;
}

message CreateUserInfoResp {
  UserInfoResponse user = 1;
}

message GetUserInfoReq {
  int64 id = 1;
}

message GetUserInfoByEmailReq {
  string email = 1;
}

message GetUserInfoByNicknameReq {
  string nickname = 1;
}

message GetUserInfoResp {
  UserInfoResponse user = 1;
}

message UpdateUserInfoProfileReq {
  int64 id = 1;
  string nickname = 2;
  string avatar = 3;
}

message UpdateUserInfoProfileResp {
  UserInfoResponse user = 1;
}

message UpdateUserInfoStatusReq {
  int64 id = 1;
  int32 status = 2;
}

message UpdateUserInfoStatusResp {
  UserInfoResponse user = 1;
}

message SearchUserInfoByNicknameReq {
  string nickname = 1;
  int32 limit = 2;
}

message SearchUserInfoByNicknameResp {
  repeated UserInfoResponse users = 1;
}

// ConversationService messages

service ConversationService {
  rpc CreateConversation(CreateConversationReq) returns (CreateConversationResp);
  rpc GetConversationHistory(GetConversationHistoryReq) returns (GetConversationHistoryResp);
  rpc GetConversationMembers(GetConversationMembersReq) returns (GetConversationMembersResp);
  rpc GetUserConversations(GetUserConversationsReq) returns (GetUserConversationsResp);
  rpc AddGroupMembers(AddGroupMembersReq) returns (AddGroupMembersResp);
  rpc RemoveGroupMembers(RemoveGroupMembersReq) returns (RemoveGroupMembersResp);
  rpc LeaveGroup(LeaveGroupReq) returns (LeaveGroupResp);
  rpc DismissGroup(DismissGroupReq) returns (DismissGroupResp);
  rpc UpdateGroupInfo(UpdateGroupInfoReq) returns (UpdateGroupInfoResp);
  rpc GrantGroupAdmin(GrantGroupAdminReq) returns (GrantGroupAdminResp);
  rpc RevokeGroupAdmin(RevokeGroupAdminReq) returns (RevokeGroupAdminResp);
  rpc TransferGroupOwner(TransferGroupOwnerReq) returns (TransferGroupOwnerResp);
  rpc GetConversationMembersDetail(GetConversationMembersDetailReq) returns (GetConversationMembersDetailResp);
  // UpdateReadReceipt upserts the caller's last-read cursor for a conversation.
  // Validates membership and ensures last_read_message_id only advances monotonically.
  rpc UpdateReadReceipt(UpdateReadReceiptReq) returns (UpdateReadReceiptResp);
  // ListConversationReadStates returns the per-member last-read cursors for a conversation.
  rpc ListConversationReadStates(ListConversationReadStatesReq) returns (ListConversationReadStatesResp);
}

message CreateConversationReq {
  string conversation_type = 1;
  int64 creator_id = 2;
  repeated int64 member_ids = 3;
  string name = 4;
  string avatar = 5;
}

message ConversationResponse {
  int64 id = 1;
  string conversation_type = 2;
  bool is_active = 3;
  int64 created_at = 4;
  repeated int64 member_ids = 5;
  string name = 6;
  string avatar = 7;
  int64 creator_id = 8;
}

message CreateConversationResp {
  ConversationResponse conversation = 1;
}

message GetConversationMembersReq {
  int64 conversation_id = 1;
}

message GetConversationMembersResp {
  int64 conversation_id = 1;
  repeated int64 member_ids = 2;
  // conversation_type — direct/group, mirrors conversations.conversation_type column.
  string conversation_type = 3;
}

message GetUserConversationsReq {
  int64 user_id = 1;
}

message GetUserConversationsResp {
  repeated ConversationResponse conversations = 1;
}

message AddGroupMembersReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  string operator_name = 3;
  repeated int64 member_ids = 4;
}

message AddGroupMembersResp {
  ConversationResponse conversation = 1;
}

message RemoveGroupMembersReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  string operator_name = 3;
  repeated int64 member_ids = 4;
}

message RemoveGroupMembersResp {}

message LeaveGroupReq {
  int64 conversation_id = 1;
  int64 user_id = 2;
  string user_name = 3;
}

message LeaveGroupResp {}

message DismissGroupReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
}

message DismissGroupResp {}

message UpdateGroupInfoReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  string operator_name = 3;
  optional string name = 4;
  optional string avatar = 5;
}

message UpdateGroupInfoResp {
  ConversationResponse conversation = 1;
}

message GrantGroupAdminReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  int64 target_user_id = 3;
}

message GrantGroupAdminResp {}

message RevokeGroupAdminReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  int64 target_user_id = 3;
}

message RevokeGroupAdminResp {}

message TransferGroupOwnerReq {
  int64 conversation_id = 1;
  int64 operator_id = 2;
  int64 target_user_id = 3;
}

message TransferGroupOwnerResp {
  ConversationResponse conversation = 1;
}

message GetConversationMembersDetailReq {
  int64 conversation_id = 1;
}

message MemberDetailItem {
  int64 user_id = 1;
  string email = 2;
  string avatar = 3;
  string role = 4;
  int64 joined_at = 5;
  string name = 6;
}

message GetConversationMembersDetailResp {
  repeated MemberDetailItem members = 1;
}

message GetConversationHistoryReq {
  int64 conversation_id = 1;
  // Cursor-based pagination: provide cursor_created_at and cursor_id for the next page.
  // If both are 0, returns the initial (latest) page.
  int64 cursor_created_at = 2; // unix milliseconds of the last message's created_at
  int64 cursor_id = 3; // message ID cursor
  int32 limit = 4; // max messages per page, default 50, max 100
}

message SenderInfo {
  string name = 1;
  string email = 2;
}

message MessageReadDetailItem {
  int64 user_id = 1;
  bool is_read = 2;
  int64 last_read_message_id = 3;
  int64 updated_at = 4; // unix milliseconds, 0 when the member has not reported a read cursor
  string name = 5;
  string email = 6;
  string avatar = 7;
}

message MessageItem {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 sender_id = 3;
  string message_type = 4;
  string content = 5; // JSON-encoded content
  string client_msg_id = 6; // optional, may be empty
  int64 created_at = 7; // unix timestamp in milliseconds
  SenderInfo sender_info = 8;
  repeated string mentions = 9; // decimal user id strings, e.g. "42"
  repeated MessageReadDetailItem read_details = 10;
  bool is_system = 11;
}

message ReadStateItem {
  int64 user_id = 1;
  int64 last_read_message_id = 2;
  int64 updated_at = 3; // unix milliseconds
  string email = 4;
  string avatar = 5;
  string name = 6;
}

message GetConversationHistoryResp {
  repeated MessageItem messages = 1;
  int64 next_cursor_created_at = 2; // 0 if no more pages
  int64 next_cursor_id = 3; // 0 if no more pages
  bool has_more = 4;
  repeated ReadStateItem read_states = 5;
}

message UpdateReadReceiptReq {
  int64 conversation_id = 1;
  int64 user_id = 2;
  int64 last_read_message_id = 3;
}

message UpdateReadReceiptResp {
  ReadStateItem read_state = 1;
}

message ListConversationReadStatesReq {
  int64 conversation_id = 1;
}

message ListConversationReadStatesResp {
  repeated ReadStateItem read_states = 1;
}

// FriendshipService messages

service FriendshipService {
  // AddFriend sends a friend request or accepts an existing pending one.
  // Idempotent: if already friends (accepted or pending), returns the existing record.
  rpc AddFriend(AddFriendReq) returns (AddFriendResp);
  // ListFriendApplications lists pending friend applications received by the user.
  rpc ListFriendApplications(ListFriendApplicationsReq) returns (ListFriendApplicationsResp);
  // AcceptFriend accepts a pending friend request.
  // Requires an existing pending friendship record where friend_id→user_id is "pending".
  // Updates it to "accepted" and creates the reverse record (user_id→friend_id, "accepted").
  rpc AcceptFriend(AcceptFriendReq) returns (AcceptFriendResp);
  // RejectFriend rejects a pending friend request.
  // Updates the existing pending record (friend_id→user_id) to "blocked".
  rpc RejectFriend(RejectFriendReq) returns (RejectFriendResp);
  // ListFriends lists all accepted friends of the user.
  rpc ListFriends(ListFriendsReq) returns (ListFriendsResp);
}

message AddFriendReq {
  int64 user_id = 1; // the requester's user id
  int64 friend_id = 2; // the target user id to add as friend
}

message FriendshipResponse {
  int64 user_id = 1;
  int64 friend_id = 2;
  string status = 3; // "pending", "accepted", "blocked"
  int64 created_at = 4; // unix timestamp in milliseconds
  int64 updated_at = 5; // unix timestamp in milliseconds
}

message AddFriendResp {
  FriendshipResponse friendship = 1;
}

message ListFriendApplicationsReq {
  int64 user_id = 1;
}

message ListFriendApplicationsResp {
  repeated FriendshipResponse applications = 1;
}

message AcceptFriendReq {
  int64 user_id = 1; // the user accepting the request
  int64 friend_id = 2; // the original requester
}

message AcceptFriendResp {
  FriendshipResponse friendship = 1;
}

message RejectFriendReq {
  int64 user_id = 1; // the user rejecting the request
  int64 friend_id = 2; // the original requester
}

message RejectFriendResp {
  FriendshipResponse friendship = 1;
}

message ListFriendsReq {
  int64 user_id = 1;
}

message ListFriendsResp {
  repeated FriendshipResponse friends = 1;
}

// BotService manages OpenAPI bots: token validation, profile lookup,
// conversation listing for the authenticated bot, and webhook configuration.
// gateway calls these RPCs after the BotAuth middleware has resolved a
// `Authorization: Bot <token>` header into a bot identity.
service BotService {
  // ValidateBotToken resolves a plaintext token into a bot identity.
  // Returns NotFound when the token hash does not match an active row.
  // Used by the gateway BotAuth middleware on every Bot OpenAPI request.
  rpc ValidateBotToken(ValidateBotTokenReq) returns (ValidateBotTokenResp);
  // GetBotProfile returns the bot's user_info snapshot for `/api/bot/v1/me`.
  rpc GetBotProfile(GetBotProfileReq) returns (GetBotProfileResp);
  // ListBotConversations returns every conversation the bot is a member of.
  rpc ListBotConversations(ListBotConversationsReq) returns (ListBotConversationsResp);
  // GetBotWebhook returns the bot's webhook configuration without the
  // plaintext signing secret (only secret_hash is stored server-side).
  rpc GetBotWebhook(GetBotWebhookReq) returns (GetBotWebhookResp);
  // SetBotWebhook upserts the bot's webhook configuration. The plaintext
  // `secret` is hashed before persistence; the same plaintext value is
  // returned to the caller so they can store it client-side once.
  rpc SetBotWebhook(SetBotWebhookReq) returns (SetBotWebhookResp);
  // DeleteBotWebhook removes the bot's webhook configuration entirely.
  rpc DeleteBotWebhook(DeleteBotWebhookReq) returns (DeleteBotWebhookResp);
  // ResolveBotWebhookEventActions maps webhook event names (e.g. message.created)
  // to the enabled actions required to subscribe to them.
  rpc ResolveBotWebhookEventActions(ResolveBotWebhookEventActionsReq) returns (ResolveBotWebhookEventActionsResp);
}

message BotIdentity {
  // bot_user_id is the bot's user_info.id (and conversation_members.user_id).
  int64 bot_user_id = 1;
  // token_id is the bot_tokens.id for audit logging.
  int64 token_id = 2;
  // action grants for this token (field name kept as scopes for API compatibility,
  // e.g. "bot.message.send", "bot.webhook.write").
  repeated string scopes = 3;
  // nickname snapshot, used for sender_info display when the bot sends.
  string nickname = 4;
  // avatar snapshot.
  string avatar = 5;
  // user_status mirrors user_info.status; non-1 means the bot is disabled.
  int32 user_status = 6;
}

message ValidateBotTokenReq {
  // plaintext_token is the raw value sent in the Authorization header.
  string plaintext_token = 1;
}

message ValidateBotTokenResp {
  BotIdentity identity = 1;
}

message GetBotProfileReq {
  int64 bot_user_id = 1;
}

message GetBotProfileResp {
  UserInfoResponse profile = 1;
}

message ListBotConversationsReq {
  int64 bot_user_id = 1;
}

message BotConversationItem {
  int64 conversation_id = 1;
  string conversation_type = 2;
  string name = 3;
  string avatar = 4;
  int64 created_at = 5;
}

message ListBotConversationsResp {
  repeated BotConversationItem conversations = 1;
}

message BotWebhookConfig {
  int64 bot_user_id = 1;
  string url = 2;
  repeated string events = 3;
  bool enabled = 4;
  int64 updated_at = 5; // unix milliseconds
}

message GetBotWebhookReq {
  int64 bot_user_id = 1;
}

message GetBotWebhookResp {
  BotWebhookConfig webhook = 1;
}

message SetBotWebhookReq {
  int64 bot_user_id = 1;
  string url = 2;
  // plaintext signing secret. Empty means: keep the existing secret on
  // upsert (do not change). Generation/rotation is the caller's job; the
  // gateway logic generates a fresh secret when empty before calling this.
  string secret = 3;
  repeated string events = 4;
  bool enabled = 5;
}

message SetBotWebhookResp {
  BotWebhookConfig webhook = 1;
}

message DeleteBotWebhookReq {
  int64 bot_user_id = 1;
}

message DeleteBotWebhookResp {
  bool deleted = 1;
}

message ResolveBotWebhookEventActionsReq {
  repeated string events = 1;
}

message WebhookEventAction {
  string event = 1;
  string action = 2;
}

message ResolveBotWebhookEventActionsResp {
  repeated WebhookEventAction event_actions = 1;
}
