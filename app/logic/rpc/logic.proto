syntax = "proto3";

package logic;

option go_package = "./pb";

service PermissionService {
  // CheckMessagePermission checks whether a sender can publish into a conversation.
  // aim-core calls this before accepting a message into Kafka.
  rpc CheckMessagePermission(CheckMessagePermissionReq) returns (CheckMessagePermissionResp);
}

service UserService {
  // CreateUserInfo creates a new user profile.
  rpc CreateUserInfo(CreateUserInfoReq) returns (CreateUserInfoResp);
  // GetUserInfo retrieves a user profile by ID.
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoResp);
  // GetUserInfoByEmail retrieves a user profile by email.
  rpc GetUserInfoByEmail(GetUserInfoByEmailReq) returns (GetUserInfoResp);
  // GetUserInfoByNickname retrieves a user profile by exact nickname.
  rpc GetUserInfoByNickname(GetUserInfoByNicknameReq) returns (GetUserInfoResp);
  // UpdateUserInfoProfile updates nickname and avatar.
  rpc UpdateUserInfoProfile(UpdateUserInfoProfileReq) returns (UpdateUserInfoProfileResp);
  // UpdateUserInfoStatus updates user status.
  rpc UpdateUserInfoStatus(UpdateUserInfoStatusReq) returns (UpdateUserInfoStatusResp);
  // SearchUserInfoByNickname searches user profiles by nickname prefix.
  rpc SearchUserInfoByNickname(SearchUserInfoByNicknameReq) returns (SearchUserInfoByNicknameResp);
}

// PermissionService messages

message CheckMessagePermissionReq {
  int64 sender_id = 1;
  int64 conversation_id = 2;
  // message_type must be a short client-supported type such as text/image/file/voice/video.
  string message_type = 3;
  // mentions is capped by the logic service before policy evaluation.
  repeated int64 mentions = 4;
}

message CheckMessagePermissionResp {
  bool allowed = 1;
  int32 biz_code = 2;
  string reason = 3;
}

// UserService messages

message UserInfoResponse {
  int64 id = 1;
  string email = 2;
  int32 status = 3;
  string nickname = 4;
  string avatar = 5;
  int64 created_at = 6;  // unix timestamp
  int64 updated_at = 7;  // unix timestamp
}

message CreateUserInfoReq {
  int64 id = 1;
  string email = 2;
  string nickname = 3;
  string avatar = 4;
}

message CreateUserInfoResp {
  UserInfoResponse user = 1;
}

message GetUserInfoReq {
  int64 id = 1;
}

message GetUserInfoByEmailReq {
  string email = 1;
}

message GetUserInfoByNicknameReq {
  string nickname = 1;
}

message GetUserInfoResp {
  UserInfoResponse user = 1;
}

message UpdateUserInfoProfileReq {
  int64 id = 1;
  string nickname = 2;
  string avatar = 3;
}

message UpdateUserInfoProfileResp {
  UserInfoResponse user = 1;
}

message UpdateUserInfoStatusReq {
  int64 id = 1;
  int32 status = 2;
}

message UpdateUserInfoStatusResp {
  UserInfoResponse user = 1;
}

message SearchUserInfoByNicknameReq {
  string nickname = 1;
  int32 limit = 2;
}

message SearchUserInfoByNicknameResp {
  repeated UserInfoResponse users = 1;
}

// ConversationService messages

service ConversationService {
  // CreateConversation creates a new conversation (direct or group).
  rpc CreateConversation(CreateConversationReq) returns (CreateConversationResp);
  // GetConversationHistory retrieves message history for a conversation with cursor-based pagination.
  rpc GetConversationHistory(GetConversationHistoryReq) returns (GetConversationHistoryResp);
  // GetConversationMembers retrieves the member IDs for a conversation.
  rpc GetConversationMembers(GetConversationMembersReq) returns (GetConversationMembersResp);
}

message CreateConversationReq {
  string conversation_type = 1; // "direct" or "group"
  int64 creator_id = 2;
  repeated int64 member_ids = 3;
}

message ConversationResponse {
  int64 id = 1;
  string conversation_type = 2;
  bool is_active = 3;
  int64 created_at = 4; // unix timestamp in milliseconds
  repeated int64 member_ids = 5;
}

message CreateConversationResp {
  ConversationResponse conversation = 1;
}

message GetConversationMembersReq {
  int64 conversation_id = 1;
}

message GetConversationMembersResp {
  int64 conversation_id = 1;
  repeated int64 member_ids = 2;
}

message GetConversationHistoryReq {
  int64 conversation_id = 1;
  // Cursor-based pagination: provide cursor_created_at and cursor_id for the next page.
  // If both are 0, returns the initial (latest) page.
  int64 cursor_created_at = 2; // unix milliseconds of the last message's created_at
  int64 cursor_id = 3; // message ID cursor
  int32 limit = 4; // max messages per page, default 50, max 100
}

message MessageItem {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 sender_id = 3;
  string message_type = 4;
  string content = 5; // JSON-encoded content
  string client_msg_id = 6; // optional, may be empty
  int64 created_at = 7; // unix timestamp in milliseconds
}

message GetConversationHistoryResp {
  repeated MessageItem messages = 1;
  int64 next_cursor_created_at = 2; // 0 if no more pages
  int64 next_cursor_id = 3; // 0 if no more pages
  bool has_more = 4;
}

// FriendshipService messages

service FriendshipService {
  // AddFriend sends a friend request or accepts an existing pending one.
  // Idempotent: if already friends (accepted or pending), returns the existing record.
  rpc AddFriend(AddFriendReq) returns (AddFriendResp);
  // ListFriendApplications lists pending friend applications received by the user.
  rpc ListFriendApplications(ListFriendApplicationsReq) returns (ListFriendApplicationsResp);
  // AcceptFriend accepts a pending friend request.
  // Requires an existing pending friendship record where friend_id→user_id is "pending".
  // Updates it to "accepted" and creates the reverse record (user_id→friend_id, "accepted").
  rpc AcceptFriend(AcceptFriendReq) returns (AcceptFriendResp);
  // RejectFriend rejects a pending friend request.
  // Updates the existing pending record (friend_id→user_id) to "blocked".
  rpc RejectFriend(RejectFriendReq) returns (RejectFriendResp);
}

message AddFriendReq {
  int64 user_id = 1; // the requester's user id
  int64 friend_id = 2; // the target user id to add as friend
}

message FriendshipResponse {
  int64 user_id = 1;
  int64 friend_id = 2;
  string status = 3; // "pending", "accepted", "blocked"
  int64 created_at = 4; // unix timestamp in milliseconds
  int64 updated_at = 5; // unix timestamp in milliseconds
}

message AddFriendResp {
  FriendshipResponse friendship = 1;
}

message ListFriendApplicationsReq {
  int64 user_id = 1;
}

message ListFriendApplicationsResp {
  repeated FriendshipResponse applications = 1;
}

message AcceptFriendReq {
  int64 user_id = 1; // the user accepting the request
  int64 friend_id = 2; // the original requester
}

message AcceptFriendResp {
  FriendshipResponse friendship = 1;
}

message RejectFriendReq {
  int64 user_id = 1; // the user rejecting the request
  int64 friend_id = 2; // the original requester
}

message RejectFriendResp {
  FriendshipResponse friendship = 1;
}
