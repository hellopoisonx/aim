Name: logic.rpc
ListenOn: 0.0.0.0:8082
Telemetry:
  Name: logic.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Nacos:
  ServerAddr: nacos:8848
  NamespaceID: ""
  Group: DEFAULT_GROUP
  Cluster: DEFAULT
  ServiceName: logic.rpc
  AdvertiseIP: aim-logic
  AdvertisePort: 8082
  Ephemeral: true
  Weight: 1
  TimeoutMs: 5000
  Username: ""
  Password: ""
  LogDir: /app/log/nacos
  CacheDir: /tmp/nacos/cache
  LogLevel: info
Postgres:
  DataSource: postgres://user:password@postgres:5432/aim_logic?sslmode=disable
CacheRedis:
  Addr: redis:6379
  Password: ""
  DB: 0
KqConsumerConf:
  Name: logic-archive-consumer
  Brokers:
    - kafka:9092
  Group: aim-logic-archive
  Topic: aim-message-transfer
  Offset: first
  Consumers: 1
  Processors: 1
UserCreatedConsumerConf:
  Name: logic-user-created-consumer
  Brokers:
    - kafka:9092
  Group: aim-logic-user-created
  Topic: aim.user.events
  Offset: first
  Consumers: 1
  Processors: 1
# Bot Webhook 投递消费者：与 ArchiveConsumer 共用 topic，但独立消费组，
# 确保 webhook 投递失败不会拖慢消息归档 offset。
BotWebhookConsumerConf:
  Name: logic-bot-webhook-consumer
  Brokers:
    - kafka:9092
  Group: aim-logic-bot-webhook
  Topic: aim-message-transfer
  Offset: last
  Consumers: 1
  Processors: 1
# 群管理系统消息生产者：群成员/群信息变更后发布系统消息事件，由 core 消费并推送到 Gateway。
ConversationEventProducerConf:
  Brokers:
    - kafka:9092
  Topic: aim.conversation.events
Quota:
  WindowSeconds: 60
  MaxRequests: 100
Dev:
  # 临时会话（非好友）单会话最多可发送的消息数。
  # 默认 10。设为 0 或负数表示不限制（仅供本地开发 / 压测使用，切勿在生产开启）。
  TemporaryConversationMessageLimit: 10
# Snowflake 机器 ID，范围 0-1023。同一 logic 实例集群中每台机器必须唯一。
MachineID: 1
