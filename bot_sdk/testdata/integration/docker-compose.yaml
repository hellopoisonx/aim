# AIM Bot SDK Integration Docker Environment
# ========================================================================
# 独立于本地开发环境的 Bot SDK 集成测试环境。
# 对宿主机发布的端口全部基于根 docker-compose.yaml 做 +3000 偏移；
# 容器内部端口与服务发现地址保持不变。
#
# 用法：
#   docker compose -f bot_sdk/testdata/integration/docker-compose.yaml up -d
#   docker compose -f bot_sdk/testdata/integration/docker-compose.yaml down -v
#
# 常用地址：
#   Gateway REST: http://127.0.0.1:11888
#   PostgreSQL:   127.0.0.1:8432
#   Redis:        127.0.0.1:9379
#   Kafka:        127.0.0.1:12092
# ========================================================================

name: aim-botsdk-integration

services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: ../../..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-it-auth
    ports:
      - "11989:8989"
    volumes:
      - ./etc/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-it-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ../../../app/auth/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h postgres -U user -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_auth'" | grep -q 1 || psql -h postgres -U user -d postgres -c "CREATE DATABASE aim_auth"
        psql -h postgres -U user -d aim_auth -f /migrations/000_init.sql
        psql -h postgres -U user -d aim_auth -f /migrations/001_require_user_name.sql
    networks:
      - aim-network

  aim-gateway:
    build:
      context: ../../..
      dockerfile: app/gateway/Dockerfile
    container_name: aim-it-gateway
    ports:
      - "11888:8888"  # REST API
      - "12090:9090"  # gRPC
    environment:
      AIM_GATEWAY_NODE_ID: 0
    volumes:
      - ./etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-logic:
    build:
      context: ../../..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: aim-it-logic
    volumes:
      - ./etc/logic.yaml:/app/etc/logic.yaml:ro
      - logic_log:/app/log
    depends_on:
      logic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - aim-network

  logic-migrate:
    image: postgres:17-alpine
    container_name: aim-it-logic-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ../../../app/logic/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h postgres -U user -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_logic'" | grep -q 1 || psql -h postgres -U user -d postgres -c "CREATE DATABASE aim_logic"
        psql -h postgres -U user -d aim_logic -f /migrations/000_extensions.sql
        psql -h postgres -U user -d aim_logic -f /migrations/001_initial_permission.sql
        psql -h postgres -U user -d aim_logic -f /migrations/002_messages.sql
        psql -h postgres -U user -d aim_logic -f /migrations/003_user_info.sql
        psql -h postgres -U user -d aim_logic -f /migrations/004_group_management.sql
        psql -h postgres -U user -d aim_logic -f /migrations/005_conversation_read_states.sql
        psql -h postgres -U user -d aim_logic -f /migrations/006_user_type.sql
        psql -h postgres -U user -d aim_logic -f /migrations/007_bot_tokens.sql
        psql -h postgres -U user -d aim_logic -f /migrations/008_bot_webhooks.sql
        psql -h postgres -U user -d aim_logic -f /migrations/009_bot_actions.sql
        psql -h postgres -U user -d aim_logic -f /migrations/010_bot_attachment_actions.sql
    networks:
      - aim-network

  aim-core:
    build:
      context: ../../..
      dockerfile: app/core/rpc/Dockerfile
    container_name: aim-it-core
    ports:
      - "11081:8080"
    volumes:
      - ./etc/core.yaml:/app/etc/core.yaml:ro
      - core_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      jaeger:
        condition: service_started
      aim-logic:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network

  aim-attachment:
    build:
      context: ../../..
      dockerfile: app/attachment/Dockerfile
    container_name: aim-it-attachment
    expose:
      - "8091"  # internal-only gRPC: gateway/core call attachment.rpc; do not publish to host
    volumes:
      - ./etc/attachment.yaml:/app/etc/attachment.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-data-parsing:
    build:
      context: ../../..
      dockerfile: app/data_parsing/Dockerfile
    container_name: aim-it-data-parsing
    volumes:
      - ./etc/data_parsing.yaml:/app/etc/data_parsing.yaml:ro
    depends_on:
      aim-attachment:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-it-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aim_auth
    ports:
      - "8432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aim_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-it-redis
    ports:
      - "9379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  kafka:
    image: apache/kafka:4.0.2
    container_name: aim-it-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:12092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:12092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    ports:
      - "12092:12092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aim-network

  kafbat-ui:
     container_name: aim-it-kafbat-ui
     image: ghcr.io/kafbat/kafka-ui:latest
     ports:
       - 11000:8080
     environment:
       DYNAMIC_CONFIG_ENABLED: 'true'
       SWAGGER_UI_ENABLED: 'true'
     depends_on:
       kafka:
           condition: service_healthy
     volumes:
       - ../../../kui/config.yaml:/etc/kafkaui/dynamic_config.yaml:ro
     networks:
       - aim-network

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-master
    command: "master -ip=seaweed-master -mdir=/data"
    ports:
      - "12333:9333"
    volumes:
      - seaweed_master_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-volume
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    ports:
      - "11088:8080"
    volumes:
      - seaweed_volume_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-filer
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "11889:8888"
    volumes:
      - seaweed_filer_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-s3
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0 -port=8333 -iam=false -config=/etc/seaweedfs/s3.json"
    depends_on:
      - seaweed-filer
    ports:
      - "11333:8333"
    volumes:
      - ./etc/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - aim-network
      - aim_shared

  seaweed-bucket-init:
    image: amazon/aws-cli:latest
    container_name: aim-it-seaweed-bucket-init
    depends_on:
      - seaweed-s3
    environment:
      AWS_ACCESS_KEY_ID: aim
      AWS_SECRET_ACCESS_KEY: aim-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "for i in $$(seq 1 30); do
        aws --endpoint-url http://seaweed-s3:8333 s3 ls s3://aim-attachments && exit 0;
        aws --endpoint-url http://seaweed-s3:8333 s3 mb s3://aim-attachments && exit 0;
        sleep 2;
      done;
      exit 1"
    networks:
      - aim-network

  kafka-init:
    image: apache/kafka:4.0.2
    container_name: aim-it-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.user.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim-message-transfer --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.conversation.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.presence.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.typing.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.read_receipt.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.attachment.uploaded --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic aim.attachment.parsed --partitions 3 --replication-factor 1
    networks:
      - aim-network

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aim-it-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "11848:8848"   # Nacos 主端口
      - "12848:9848"   # 必须暴露：客户端 gRPC 请求服务端口
      - "12849:9849"   # 必须暴露：服务端 gRPC 内部通信端口
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      # 修正健康检查路径，Nacos 默认带 /nacos/index.html
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Observability ====================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: aim-it-jaeger
    ports:
      - "19686:16686"    # Jaeger UI
      - "7317:4317"      # OTLP gRPC receiver
      - "7318:4318"      # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge
  aim_shared:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  nacos_data:
  nacos_logs:
  gateway_log:
  auth_log:
  logic_log:
  core_log:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
