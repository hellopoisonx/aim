# AIM Bot SDK Integration Docker Environment
# ========================================================================
# 独立于本地开发环境的 Bot SDK 集成测试环境。
# 对宿主机发布的端口全部基于根 docker-compose.yaml 做 +3000 偏移；
# 容器内部端口与服务发现地址保持不变。
#
# 用法：
#   docker compose -f bot_sdk/testdata/integration/docker-compose.yaml up -d
#   docker compose -f bot_sdk/testdata/integration/docker-compose.yaml down -v
#
# 常用地址：
#   Gateway REST: http://127.0.0.1:11888
#   PostgreSQL:   127.0.0.1:8432
#   Redis:        127.0.0.1:9379
#   RocketMQ:     127.0.0.1:18081 (proxy gRPC), 127.0.0.1:19876 (name server), 127.0.0.1:11000 (dashboard)
# ========================================================================

name: aim-botsdk-integration

services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: ../../..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-it-auth
    ports:
      - "11989:8989"
    volumes:
      - ./etc/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      aim-it-etcd:
        condition: service_healthy

      tempo:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-it-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      AIM_DATABASE: aim_auth
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../../app/auth/rpc/model/migrations:/migrations:ro
      - ../../../deploy/scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-gateway:
    build:
      context: ../../..
      dockerfile: app/gateway/Dockerfile
    container_name: aim-it-gateway
    ports:
      - "11888:8888"  # REST API
      - "12091:9091"  # gRPC
    environment:
      AIM_GATEWAY_NODE_ID: 0
    volumes:
      - ./etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      aim-it-etcd:
        condition: service_healthy

      tempo:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-logic:
    build:
      context: ../../..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: aim-it-logic
    volumes:
      - ./etc/logic.yaml:/app/etc/logic.yaml:ro
      - logic_log:/app/log
    depends_on:
      logic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      aim-it-etcd:
        condition: service_healthy

      tempo:
        condition: service_started
    networks:
      - aim-network

  logic-migrate:
    image: postgres:17-alpine
    container_name: aim-it-logic-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      AIM_DATABASE: aim_logic
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../../app/logic/rpc/model/migrations:/migrations:ro
      - ../../../deploy/scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-core:
    build:
      context: ../../..
      dockerfile: app/core/rpc/Dockerfile
    container_name: aim-it-core
    ports:
      - "11081:8080"
    volumes:
      - ./etc/core.yaml:/app/etc/core.yaml:ro
      - core_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      aim-it-etcd:
        condition: service_healthy

      tempo:
        condition: service_started
      aim-logic:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network

  aim-attachment:
    build:
      context: ../../..
      dockerfile: app/attachment/Dockerfile
    container_name: aim-it-attachment
    expose:
      - "8091"  # internal-only gRPC: gateway/core call attachment.rpc; do not publish to host
    volumes:
      - ./etc/attachment.yaml:/app/etc/attachment.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-data-parsing:
    build:
      context: ../../..
      dockerfile: app/data_parsing/Dockerfile
    container_name: aim-it-data-parsing
    volumes:
      - ./etc/data_parsing.yaml:/app/etc/data_parsing.yaml:ro
    depends_on:
      aim-attachment:
        condition: service_started
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-it-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "8432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-it-redis
    ports:
      - "9379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.3
    container_name: aim-it-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    expose:
      - "9876"
    ports:
      - "19876:9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - aim-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    container_name: aim-it-rocketmq-broker
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    expose:
      - "10909"
      - "10911"
      - "10912"
    # Named volumes are root-owned; the broker must write its store as root.
    user: "0:0"
    volumes:
      - ../../../deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_broker_store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - aim-network

  rocketmq-proxy:
    image: apache/rocketmq:5.3.3
    container_name: aim-it-rocketmq-proxy
    command: ["sh", "mqproxy", "-n", "rocketmq-namesrv:9876"]
    expose:
      - "8080"
      - "8081"
    ports:
      - "18081:8081"
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - aim-network

  rocketmq-dashboard:
    container_name: aim-it-rocketmq-dashboard
    image: apacherocketmq/rocketmq-dashboard:latest
    ports:
      - "11000:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - aim-network

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-master
    command: "master -ip=seaweed-master -mdir=/data"
    ports:
      - "12333:9333"
    volumes:
      - seaweed_master_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-volume
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    ports:
      - "11088:8080"
    volumes:
      - seaweed_volume_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-filer
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "11889:8888"
    volumes:
      - seaweed_filer_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: aim-it-seaweed-s3
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0 -port=8333 -iam=false -config=/etc/seaweedfs/s3.json"
    depends_on:
      - seaweed-filer
    ports:
      - "11333:8333"
    volumes:
      - ./etc/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - aim-network
      - aim_shared

  seaweed-bucket-init:
    image: amazon/aws-cli:latest
    container_name: aim-it-seaweed-bucket-init
    depends_on:
      - seaweed-s3
    environment:
      SEAWEED_ACCESS_KEY: aim
      SEAWEED_SECRET_KEY: aim-secret
      SEAWEED_BUCKET: aim-attachments
      SEAWEED_REGION: us-east-1
      SEAWEED_S3_ENDPOINT: http://seaweed-s3:8333
    volumes:
      - ../../../deploy/scripts/init-seaweed-bucket.sh:/scripts/init-seaweed-bucket.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-seaweed-bucket.sh"]
    networks:
      - aim-network

  rocketmq-init:
    image: apache/rocketmq:5.3.3
    container_name: aim-it-rocketmq-init
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    environment:
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      ROCKETMQ_CLUSTER: DefaultCluster
      ROCKETMQ_QUEUES: 4
    volumes:
      - ../../../deploy/scripts/init-rocketmq-topics.sh:/scripts/init-rocketmq-topics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-rocketmq-topics.sh"]
    restart: "no"
    networks:
      - aim-network

  aim-it-etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: aim-it-etcd
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    ports:
      - "5379:2379"
      - "5380:2380"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Observability ====================

  tempo:
    image: grafana/tempo:2.8.1
    container_name: aim-it-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
      - "6200:3200"      # Tempo HTTP API (+3000)
      - "7317:4317"      # OTLP gRPC receiver (+3000)
      - "7318:4318"      # OTLP HTTP receiver (+3000)
    volumes:
      - ../../../deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge
  aim_shared:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rocketmq_broker_store:
  etcd_data:

  gateway_log:
  auth_log:
  logic_log:
  core_log:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  tempo_data:
