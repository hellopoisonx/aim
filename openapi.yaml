openapi: "3.0.3"
info:
  title: AIM 即时通讯系统 API
  description: |
    AIM 是一个面向多人在线的即时通讯系统，内置可自部署的 AI 助手。

    ## 概述

    本 API 文档涵盖 AIM 网关层（aim-gateway）对外暴露的所有 REST API 和 WebSocket 端点。

    ### 响应格式

    所有 HTTP 响应均采用统一信封格式：

    **成功响应**:
    ```json
    {
      "code": 0,
      "msg": "ok",
      "body": { ... }
    }
    ```

    **错误响应**:
    ```json
    {
      "code": 40000,
      "msg": "参数格式错误"
    }
    ```

    ### 错误码体系

    | 错误码范围 | 含义 | HTTP 状态码 |
    |-----------|------|------------|
    | `0` | 成功 | 200 |
    | `1001` | 邮箱或密码无效 | 401 |
    | `1002` | 用户不存在 | 404 |
    | `1003` | 用户已存在 | 409 |
    | `1004` | 令牌无效 | 401 |
    | `1005` | 令牌已过期 | 401 |
    | `1006` | 用户已被封禁 | 403 |
    | `40000` | 请求参数错误 | 400 |
    | `40100` | 认证失败 | 401 |
    | `40300` | 权限不足 | 403 |
    | `40400` | 资源不存在 | 404 |
    | `40900` | 资源冲突 | 409 |
    | `42900` | 请求频率超限 | 429 |
    | `50000` | 服务器内部错误 | 500 |

    ### 认证方式

    - **REST API**: 请求体传递认证参数（邮箱 + 密码），成功返回 JWT 令牌对
    - **WebSocket**: 在握手请求的 `Authorization` 头中携带 `Bearer <access_token>`
    - **令牌刷新**: 使用 `/api/auth/refresh` 接口，传入 `refresh_token` 获取新的令牌对
    - **登出**: 调用 `/api/auth/logout` 时需在 `Authorization` 头中携带当前 `access_token`

  version: "1.0.0"
  contact:
    name: AIM Team

servers:
  - url: http://localhost:8888
    description: 本地开发环境（Gateway API 默认端口）

tags:
  - name: 认证
    description: 用户注册、登录、令牌刷新与登出相关接口
  - name: 用户
    description: 用户资料查询相关接口
  - name: WebSocket
    description: WebSocket 长连接端点，用于实时消息收发与状态同步

paths:
  /api/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: |
        使用邮箱和密码注册新用户。密码长度至少为 8 位。

        注册成功后返回用户 ID。后续需调用登录接口获取访问令牌。
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              默认示例:
                summary: 注册新用户
                value:
                  email: "user@example.com"
                  password: "Password123!"
                  username: "新用户"
                  device_id: "device-abc-123"
      responses:
        "200":
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/RegisterResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  user_id: 1001
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 用户已存在（邮箱重复）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 1003
                msg: "user already exists"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: |
        使用邮箱和密码登录，成功后返回 JWT 访问令牌和刷新令牌对。

        - `access_token`: 用于 API 认证和 WebSocket 连接，有效期较短
        - `refresh_token`: 用于刷新令牌对，有效期较长
        - `expires_at`: 访问令牌的过期时间（Unix 时间戳，秒）
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              默认示例:
                summary: 用户登录
                value:
                  email: "user@example.com"
                  password: "Password123!"
                  device_id: "device-abc-123"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/LoginResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  user_id: 1001
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
                  refresh_token: "eyJhbGciOiJIUzI1NiIs..."
                  expires_at: 1715678900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 认证失败（邮箱或密码无效 / 用户被封禁）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                凭证无效:
                  summary: 邮箱或密码错误
                  value:
                    code: 1001
                    msg: "invalid email or password"
                用户封禁:
                  summary: 用户被封禁
                  value:
                    code: 1006
                    msg: "user is banned"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新令牌
      description: |
        使用 `refresh_token` 刷新令牌对。成功返回新的 `access_token` 和 `refresh_token` 对。

        旧的刷新令牌在本次调用后失效。
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              默认示例:
                summary: 刷新令牌
                value:
                  refresh_token: "eyJhbGciOiJIUzI1NiIs..."
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/RefreshResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
                  refresh_token: "eyJhbGciOiJIUzI1NiIs..."
                  expires_at: 1715678900
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: 刷新令牌无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                令牌无效:
                  summary: 令牌无效
                  value:
                    code: 1004
                    msg: "invalid token"
                令牌过期:
                  summary: 令牌已过期
                  value:
                    code: 1005
                    msg: "token expired"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags:
        - 认证
      summary: 用户登出
      description: |
        使当前会话失效。需要在请求头中携带 `Authorization: Bearer <access_token>`。

        登出后，服务端将清理该设备对应的会话状态。
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/LogoutResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  success: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/by-name/{name}:
    get:
      tags:
        - 用户
      summary: 按昵称模糊查询用户
      description: |
        通过用户昵称模糊查询用户列表。nickname 不唯一，该接口返回匹配用户列表，列表项仅包含 `id`、`email`、`avatar`。

        网关将请求代理到 aim-logic 的 `UserService.SearchUserInfoByNickname` RPC，底层使用 PostgreSQL `pg_trgm`/GIN 索引支撑模糊匹配。
      operationId: getUserByName
      parameters:
        - name: name
          in: path
          required: true
          description: 用户昵称，模糊匹配
          schema:
            type: string
            example: "Alice"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/GetUserByNameResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  users:
                    - id: 1001
                      email: "alice@example.com"
                      avatar: "https://implement.me"
                    - id: 1002
                      email: "alice2@example.com"
                      avatar: "https://example.com/alice2.png"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 40400
                msg: "user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/by-id/{id}:
    get:
      tags:
        - 用户
      summary: 按 ID 查询用户详情
      description: |
        通过用户 ID 查询单个用户资料详情。

        网关将请求代理到 aim-logic 的 `UserService.GetUserInfo` RPC。
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: 用户 ID
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseEnvelope"
                  - type: object
                    properties:
                      body:
                        $ref: "#/components/schemas/GetUserByIdResponse"
              example:
                code: 0
                msg: "ok"
                body:
                  user:
                    id: 1001
                    email: "alice@example.com"
                    status: 1
                    nickname: "Alice"
                    avatar: "https://implement.me"
                    created_at: 1715678900
                    updated_at: 1715678900
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: 40400
                msg: "user not found"
        "500":
          $ref: "#/components/responses/InternalError"

  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket 连接端点
      description: |
        建立 WebSocket 长连接，用于实时消息收发、在线状态同步和心跳保活。

        ## 连接流程

        1. 客户端发起 HTTP GET 请求，携带 `Authorization: Bearer <access_token>` 头
        2. 网关验证 JWT 令牌，校验通过后升级为 WebSocket 连接
        3. 注册连接（按 `user_id + device_id` 标识），同一身份标识只允许一个连接
        4. 连接建立后，通过二进制 Protobuf 帧进行双向通信
        5. 令牌过期前网关发送 `TOKEN_EXPIRED` 帧并断开连接
        6. 连接断开时自动注销并写入离线状态

        ## 注意事项

        - 每个 `user_id + device_id` 组合只能维持一个 WebSocket 连接
        - 连接空闲超过心跳周期（默认 30 秒）未收到客户端心跳帧，服务端将断开连接
        - 令牌过期时服务端主动推送 `TOKEN_EXPIRED` 帧后断开，客户端需重新登录获取新令牌

        ## WebSocket 帧协议（Protobuf 二进制）

        所有通信帧均采用 Protobuf 二进制编码，帧结构定义在 `shared/proto/ws/ws.proto`。

        ### 客户端 → 服务端

        | 帧类型 | 数值 | 用途 |
        |-------|------|------|
        | `SEND_MESSAGE` | 1 | 发送聊天消息 |
        | `HEARTBEAT` | 2 | 心跳保活 |
        | `TYPING` | 3 | 输入中状态通知（预留，暂未处理） |
        | `READ_RECEIPT` | 4 | 已读回执（预留，暂未处理） |
        | `ACK` | 5 | 消息确认（预留，暂未处理） |

        ### 服务端 → 客户端

        | 帧类型 | 数值 | 用途 |
        |-------|------|------|
        | `PUSH_MESSAGE` | 101 | 推送新消息 |
        | `PUSH_PRESENCE` | 102 | 推送在线状态变更 |
        | `PUSH_NOTIFICATION` | 103 | 推送系统通知（预留） |
        | `PUSH_TYPING` | 104 | 推送输入中状态（预留） |
        | `RECONNECT` | 105 | 通知客户端重连（网关节点下线时） |
        | `SERVER_ACK` | 106 | 服务端确认（响应 SEND_MESSAGE / HEARTBEAT） |
        | `TOKEN_EXPIRED` | 107 | 令牌过期通知 |

        ### SEND_MESSAGE 帧载荷

        ```json
        {
          "conversation_id": 12345,
          "message_type": 1,
          "content": "Hello!",
          "client_msg_id": "msg-uuid-001",
          "mentions": []
        }
        ```

        ### SERVER_ACK 帧载荷

        ```json
        {
          "ack_seq": 10,
          "client_msg_id": "msg-uuid-001",
          "code": 0,
          "msg": "",
          "status": 0,
          "message_id": 56789
        }
        ```

        `status` 取值: `0` = 已接受, `1` = 已拒绝, `2` = 可重试

        ### 认证失败

        如果 JWT 验证失败，网关**不会**升级为 WebSocket，而是直接返回 JSON 错误响应：

        ```json
        {
          "code": 40100,
          "msg": "invalid token"
        }
        ```

        HTTP 状态码为 `401 Unauthorized`。
      operationId: websocket
      parameters:
        - name: Authorization
          in: header
          required: true
          description: JWT 访问令牌，格式 `Bearer <access_token>`
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIs..."
      security:
        - BearerAuth: []
      responses:
        "101":
          description: |
            协议升级成功（Switching Protocols），连接已升级为 WebSocket。

            此后双方使用 Protobuf 二进制帧进行通信。
        "401":
          description: 认证失败，令牌无效或已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                令牌无效:
                  summary: 无效令牌
                  value:
                    code: 1004
                    msg: "invalid token"
                令牌过期:
                  summary: 令牌已过期
                  value:
                    code: 1005
                    msg: "token expired"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        在 HTTP 请求头中携带 JWT 访问令牌。
        格式: `Authorization: Bearer <access_token>`

  schemas:
    # ========== 通用结构 ==========

    ResponseEnvelope:
      type: object
      description: 成功响应的统一信封格式
      required:
        - code
        - msg
        - body
      properties:
        code:
          type: integer
          description: 业务状态码，`0` 表示成功
          example: 0
        msg:
          type: string
          description: 状态消息，成功时为 `ok`
          example: "ok"
        body:
          description: 响应数据体，具体类型由接口决定

    ErrorResponse:
      type: object
      description: 错误响应的统一格式
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          description: 业务错误码，参见文档顶部错误码表
          example: 40000
        msg:
          type: string
          description: 人类可读的错误描述
          example: "请求参数错误"

    # ========== 注册 ==========

    RegisterRequest:
      type: object
      description: 用户注册请求
      required:
        - email
        - password
        - device_id
      properties:
        email:
          type: string
          format: email
          description: 用户邮箱，需符合邮箱格式
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          description: 登录密码，最少 8 个字符
          example: "Password123!"
        username:
          type: string
          description: 用户昵称（可选）
          example: "新用户"
        avatar:
          type: string
          format: uri
          description: 头像 URL（可选）
          example: "https://example.com/avatar.png"
        device_id:
          type: string
          description: 设备唯一标识
          example: "device-abc-123"

    RegisterResponse:
      type: object
      description: 用户注册响应
      properties:
        user_id:
          type: integer
          format: int64
          description: 新注册用户的唯一 ID
          example: 1001

    # ========== 登录 ==========

    LoginRequest:
      type: object
      description: 用户登录请求
      required:
        - email
        - password
        - device_id
      properties:
        email:
          type: string
          format: email
          description: 用户注册邮箱
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          description: 登录密码
          example: "Password123!"
        device_id:
          type: string
          description: 设备唯一标识
          example: "device-abc-123"

    LoginResponse:
      type: object
      description: 登录成功响应
      properties:
        user_id:
          type: integer
          format: int64
          description: 用户 ID
          example: 1001
        access_token:
          type: string
          description: JWT 访问令牌，用于后续 API 认证和 WebSocket 连接
          example: "eyJhbGciOiJIUzI1NiIs..."
        refresh_token:
          type: string
          description: JWT 刷新令牌，用于在访问令牌过期后获取新令牌对
          example: "eyJhbGciOiJIUzI1NiIs..."
        expires_at:
          type: integer
          format: int64
          description: 访问令牌过期时间（Unix 时间戳，秒）
          example: 1715678900

    # ========== 刷新令牌 ==========

    RefreshRequest:
      type: object
      description: 刷新令牌请求
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: 当前有效的刷新令牌
          example: "eyJhbGciOiJIUzI1NiIs..."

    RefreshResponse:
      type: object
      description: 刷新令牌响应
      properties:
        access_token:
          type: string
          description: 新的 JWT 访问令牌
          example: "eyJhbGciOiJIUzI1NiIs..."
        refresh_token:
          type: string
          description: 新的 JWT 刷新令牌（旧的刷新令牌同时失效）
          example: "eyJhbGciOiJIUzI1NiIs..."
        expires_at:
          type: integer
          format: int64
          description: 新访问令牌的过期时间（Unix 时间戳，秒）
          example: 1715678900

    # ========== 登出 ==========

    LogoutResponse:
      type: object
      description: 登出响应
      properties:
        success:
          type: boolean
          description: 是否登出成功
          example: true

    # ========== 用户资料 ==========

    UserInfo:
      type: object
      description: 用户资料
      properties:
        id:
          type: integer
          format: int64
          description: 用户 ID
          example: 1001
        email:
          type: string
          format: email
          description: 用户邮箱
          example: "alice@example.com"
        status:
          type: integer
          format: int32
          description: 用户状态
          example: 1
        nickname:
          type: string
          description: 用户昵称
          example: "Alice"
        avatar:
          type: string
          format: uri
          description: 头像 URL
          example: "https://implement.me"
        created_at:
          type: integer
          format: int64
          description: 创建时间（Unix 时间戳，秒）
          example: 1715678900
        updated_at:
          type: integer
          format: int64
          description: 更新时间（Unix 时间戳，秒）
          example: 1715678900

    GetUserByNameResponse:
      type: object
      description: 按昵称模糊查询用户响应
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"

    GetUserByIdResponse:
      type: object
      description: 按 ID 查询用户详情响应
      properties:
        user:
          $ref: "#/components/schemas/UserInfo"

    UserListItem:
      type: object
      description: 用户列表项
      properties:
        id:
          type: integer
          format: int64
          description: 用户 ID
          example: 1001
        email:
          type: string
          format: email
          description: 用户邮箱
          example: "alice@example.com"
        avatar:
          type: string
          format: uri
          description: 头像 URL
          example: "https://implement.me"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
