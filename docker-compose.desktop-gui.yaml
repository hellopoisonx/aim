services:
  aim-desktop-gui:
    build:
      context: .
      dockerfile: app/desktop/docker/gui/Dockerfile
    container_name: aim-desktop-gui
    environment:
      AIM_GATEWAY_URL: ${AIM_DESKTOP_GATEWAY_URL:-http://aim-gateway:8888}
      AIM_WS_URL: ${AIM_DESKTOP_WS_URL:-ws://aim-gateway:8888/ws}
      SCREEN_GEOMETRY: ${AIM_DESKTOP_SCREEN_GEOMETRY:-1280x800x24}
      VNC_PASSWORD: ${AIM_DESKTOP_VNC_PASSWORD:-}
    ports:
      - "127.0.0.1:${AIM_DESKTOP_NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${AIM_DESKTOP_VNC_PORT:-5900}:5900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./app/desktop/build/bin/aim-desktop
        target: /opt/aim-desktop/aim-desktop
        read_only: true
        bind:
          create_host_path: false
      - desktop_gui_config:/home/aim/.config/aim-desktop
    shm_size: "256m"
    security_opt:
      - seccomp=unconfined
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge

volumes:
  desktop_gui_config:
