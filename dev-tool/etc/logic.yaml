Name: logic.rpc
ListenOn: 0.0.0.0:8082
Prometheus:
  Host: 0.0.0.0
  Port: 19194
  Path: /metrics
Telemetry:
  Name: logic.rpc
  Endpoint: bench-tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - bench-etcd:2379
  Key: logic.rpc
Postgres:
  DataSource: postgres://benchuser:benchpassword@bench-postgres:5432/aim_logic?sslmode=disable
CacheRedis:
  Addr: bench-redis:6379
  Password: ""
  DB: 0
KqConsumerConf:
  Name: logic-archive-consumer
  Brokers:
    - bench-kafka:9092
  Group: aim-logic-archive
  Topic: aim-message-transfer
  Offset: first
  Consumers: 1
  Processors: 1
UserCreatedConsumerConf:
  Name: logic-user-created-consumer
  Brokers:
    - bench-kafka:9092
  Group: aim-logic-user-created
  Topic: aim.user.events
  Offset: first
  Consumers: 1
  Processors: 1
# 群管理系统消息生产者：群成员/群信息变更后发布系统消息事件，由 core 消费并推送到 Gateway。
ConversationEventProducerConf:
  Brokers:
    - bench-kafka:9092
  Topic: aim.conversation.events
Dev:
  # 临时会话（非好友）单会话最多可发送的消息数。
  # 默认 10。当前 ServiceContext 会把 0 归一化为默认值；压测环境使用 -1 表示不限制。
  TemporaryConversationMessageLimit: -1
