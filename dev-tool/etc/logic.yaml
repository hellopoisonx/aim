Name: logic.rpc
ListenOn: 0.0.0.0:8082
Telemetry:
  Name: logic.rpc
  Endpoint: bench-jaeger:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Nacos:
  ServerAddr: bench-nacos:8848
  NamespaceID: ""
  Group: DEFAULT_GROUP
  Cluster: DEFAULT
  ServiceName: logic.rpc
  AdvertiseIP: bench-logic
  AdvertisePort: 8082
  Ephemeral: true
  Weight: 1
  TimeoutMs: 5000
  Username: ""
  Password: ""
  LogDir: /app/log/nacos
  CacheDir: /tmp/nacos/cache
  LogLevel: info
Postgres:
  DataSource: postgres://benchuser:benchpassword@bench-postgres:5432/aim_logic?sslmode=disable
CacheRedis:
  Addr: bench-redis:6379
  Password: ""
  DB: 0
KqConsumerConf:
  Name: logic-archive-consumer
  Brokers:
    - bench-kafka:9092
  Group: aim-logic-archive
  Topic: aim-message-transfer
  Offset: first
  Consumers: 1
  Processors: 1
UserCreatedConsumerConf:
  Name: logic-user-created-consumer
  Brokers:
    - bench-kafka:9092
  Group: aim-logic-user-created
  Topic: aim.user.events
  Offset: first
  Consumers: 1
  Processors: 1
Quota:
  WindowSeconds: 60
  MaxRequests: 100
Dev:
  # 临时会话（非好友）单会话最多可发送的消息数。
  # 默认 10。当前 ServiceContext 会把 0 归一化为默认值；压测环境使用 -1 表示不限制。
  TemporaryConversationMessageLimit: -1
