Name: gateway-api
Host: 0.0.0.0
Port: 8888
Prometheus:
  Host: 0.0.0.0
  Port: 19191
  Path: /metrics
Telemetry:
  Name: gateway-api
  Endpoint: bench-tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
AuthRpc:
  Etcd:
    Hosts:
      - bench-etcd:2379
    Key: auth.rpc
CoreRpc:
  Etcd:
    Hosts:
      - bench-etcd:2379
    Key: core.rpc
LogicRpc:
  Etcd:
    Hosts:
      - bench-etcd:2379
    Key: logic.rpc
Auth:
  AccessSecret: aim-dev-access-secret
WebSocket:
  OriginPatterns: []
  ReadLimit: 32768
  WriteLimit: 32768
  PongWait: 30
  PingPeriod: 15
  MaxMsgSize: 1024
  ServerAckDelay: 5
  HeartbeatInterv: 30
Redis:
  Addr: bench-redis:6379
  Password: ""
  DB: 0
  PresenceTTL: 45
Kafka:
  Brokers:
    - bench-kafka:9092
  PresenceTopic: aim.presence.events
  TypingTopic: aim.typing.events
  ReadReceiptTopic: aim.read_receipt.events
GatewayRpc:
  Name: gateway.rpc
  ListenOn: 0.0.0.0:9091
  Etcd:
    Hosts:
      - bench-etcd:2379
    Key: gateway.rpc
  Prometheus:
    Host: 0.0.0.0
    Port: 19191
    Path: /metrics
  Telemetry:
    Name: gateway.rpc
    Endpoint: bench-tempo:4318
    Sampler: 1.0
    Batcher: otlphttp
    OtlpHttpPath: /v1/traces
AttachmentRpc:
  Etcd:
    Hosts:
      - bench-etcd:2379
    Key: attachment.rpc
