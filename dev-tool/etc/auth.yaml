Name: auth.rpc
ListenOn: 0.0.0.0:8989
Prometheus:
  Host: 0.0.0.0
  Port: 19192
  Path: /metrics
Telemetry:
  Name: auth.rpc
  Endpoint: bench-tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - bench-etcd:2379
  Key: auth.rpc
Postgres:
  DataSource: postgres://benchuser:benchpassword@bench-postgres:5432/aim_auth?sslmode=disable
SessionRedis:
  Host: bench-redis:6379
  Pass: ""
Token:
  AccessSecret: aim-dev-access-secret
  AccessTTL: 30m
  RefreshTTL: 168h
  SnowflakeMachineID: 1
KqPusherConf:
  Brokers:
    - bench-kafka:9092
  Topic: aim.user.events
