# AIM Benchmark Environment
# ========================================================================
# 独立于本地开发环境的压测环境，端口全部 +10000 偏移，避免冲突。
#
# 用法:
#   docker compose up -d                    # 启动压测环境
#   python benchmark.py register --users 100
#   docker compose down -v                  # 停止并清理数据
#
# 环境变量:
#   AIM_GATEWAY_HTTP=http://127.0.0.1:18888  (压测 gateway REST)
#   AIM_GATEWAY_WS=ws://127.0.0.1:18888/ws   (压测 gateway WS)
# ========================================================================

services:
  # ==================== AIM Services ====================

  bench-auth:
    build:
      context: ..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: bench-auth
    ports:
      - "18989:8989"
    volumes:
      - ./etc/auth.yaml:/app/etc/auth.yaml:ro
      - bench_auth_log:/app/log
    depends_on:
      bench-auth-migrate:
        condition: service_completed_successfully
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-kafka:
        condition: service_healthy
      bench-kafka-init:
        condition: service_completed_successfully
      bench-nacos:
        condition: service_healthy
      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-auth-migrate:
    image: postgres:17-alpine
    container_name: bench-auth-migrate
    depends_on:
      bench-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: benchpassword
    volumes:
      - ../app/auth/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h bench-postgres -U benchuser -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_auth'" | grep -q 1 || psql -h bench-postgres -U benchuser -d postgres -c "CREATE DATABASE aim_auth"
        psql -h bench-postgres -U benchuser -d aim_auth -f /migrations/000_init.sql
        psql -h bench-postgres -U benchuser -d aim_auth -f /migrations/001_require_user_name.sql
    networks:
      - bench-network

  bench-gateway:
    build:
      context: ..
      dockerfile: app/gateway/Dockerfile
    container_name: bench-gateway
    ports:
      - "18888:8888"   # REST API (+10000)
      - "19091:9090"   # gRPC   (+10001, avoids bench Prometheus 19090)
    environment:
      AIM_GATEWAY_NODE_ID: 0
    volumes:
      - ./etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - bench_gateway_log:/app/log
    depends_on:
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-kafka:
        condition: service_healthy
      bench-kafka-init:
        condition: service_completed_successfully
      bench-nacos:
        condition: service_healthy
      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-logic:
    build:
      context: ..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: bench-logic
    expose:
      - "19194"  # Prometheus metrics
    volumes:
      - ./etc/logic.yaml:/app/etc/logic.yaml:ro
      - bench_logic_log:/app/log
    depends_on:
      bench-logic-migrate:
        condition: service_completed_successfully
      bench-redis:
        condition: service_healthy
      bench-kafka:
        condition: service_healthy
      bench-kafka-init:
        condition: service_completed_successfully
      bench-nacos:
        condition: service_healthy
      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-logic-migrate:
    image: postgres:17-alpine
    container_name: bench-logic-migrate
    depends_on:
      bench-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: benchpassword
    volumes:
      - ../app/logic/rpc/model/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        psql -h bench-postgres -U benchuser -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'aim_logic'" | grep -q 1 || psql -h bench-postgres -U benchuser -d postgres -c "CREATE DATABASE aim_logic"
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/000_extensions.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/001_initial_permission.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/002_messages.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/003_user_info.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/004_group_management.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/005_conversation_read_states.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/006_user_type.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/007_bot_tokens.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/008_bot_webhooks.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/009_bot_actions.sql
        psql -h bench-postgres -U benchuser -d aim_logic -f /migrations/010_bot_attachment_actions.sql
      - bench-network

  bench-core:
    build:
      context: ..
      dockerfile: app/core/rpc/Dockerfile
    container_name: bench-core
    ports:
      - "18081:8080"
    expose:
      - "19193"  # Prometheus metrics
    volumes:
      - ./etc/core.yaml:/app/etc/core.yaml:ro
      - bench_core_log:/app/log
    depends_on:
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-kafka:
        condition: service_healthy
      bench-kafka-init:
        condition: service_completed_successfully
      bench-nacos:
        condition: service_healthy
      bench-tempo:
        condition: service_started
      bench-logic:
        condition: service_started
    networks:
      - bench-network

  # ==================== Data Stores ====================

  bench-postgres:
    image: postgres:17-alpine
    container_name: bench-postgres
    environment:
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpassword
      POSTGRES_DB: aim_auth
    ports:
      - "15432:5432"
    volumes:
      - bench_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser -d aim_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: bench-redis
    ports:
      - "16379:6379"
    volumes:
      - bench_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-kafka:
    image: apache/kafka:4.0.2
    container_name: bench-kafka
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@127.0.0.1:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://bench-kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    ports:
      - "19092:9092"
    volumes:
      - bench_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bench-network

  bench-kafbat-ui:
    container_name: bench-kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 18000:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
    depends_on:
      bench-kafka:
        condition: service_healthy
    volumes:
      - ./kui/config.yaml:/etc/kafkaui/dynamic_config.yaml:ro
    networks:
      - bench-network

  bench-kafka-init:
    image: apache/kafka:4.0.2
    container_name: bench-kafka-init
    depends_on:
      bench-kafka:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim.user.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim-message-transfer --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim.conversation.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim.presence.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim.typing.events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server bench-kafka:9092 --create --if-not-exists --topic aim.read_receipt.events --partitions 3 --replication-factor 1
    networks:
      - bench-network

  bench-nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: bench-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "18848:8848"
      - "19848:9848"
      - "19849:9849"
    volumes:
      - bench_nacos_data:/home/nacos/data
      - bench_nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  # ==================== Observability ====================

  bench-tempo:
    image: grafana/tempo:2.8.1
    container_name: bench-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
      - "13200:3200"     # Tempo HTTP API / Grafana datasource (+10000)
      - "14317:4317"     # OTLP gRPC (+10000)
      - "14318:4318"     # OTLP HTTP (+10000)
    volumes:
      - ../deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - bench_tempo_data:/var/tempo
    networks:
      bench-network:
        aliases:
          - tempo

  bench-prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bench_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    networks:
      bench-network:
        aliases:
          - prometheus

  bench-loki:
    image: grafana/loki:latest
    container_name: bench-loki
    ports:
      - "13100:3100"
    volumes:
      - ../deploy/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - bench_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      bench-network:
        aliases:
          - loki

  bench-promtail:
    image: grafana/promtail:latest
    container_name: bench-promtail
    volumes:
      - ../deploy/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - bench-network

  bench-grafana:
    image: grafana/grafana:latest
    container_name: bench-grafana
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bench_grafana_data:/var/lib/grafana
    networks:
      - bench-network

networks:
  bench-network:
    driver: bridge

volumes:
  bench_postgres_data:
  bench_redis_data:
  bench_kafka_data:
  bench_nacos_data:
  bench_nacos_logs:
  bench_gateway_log:
  bench_auth_log:
  bench_logic_log:
  bench_core_log:
  bench_prometheus_data:
  bench_loki_data:
  bench_grafana_data:
  bench_tempo_data:
