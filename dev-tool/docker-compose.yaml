# AIM Benchmark Environment
# ========================================================================
# 独立于本地开发环境的压测环境，端口全部 +10000 偏移，避免冲突。
#
# 用法:
#   docker compose up -d                    # 启动压测环境
#   python benchmark.py register --users 100
#   docker compose down -v                  # 停止并清理数据
#
# 环境变量:
#   AIM_GATEWAY_HTTP=http://127.0.0.1:18888  (压测 gateway REST)
#   AIM_GATEWAY_WS=ws://127.0.0.1:18888/ws   (压测 gateway WS)
# ========================================================================

services:
  # ==================== AIM Services ====================

  bench-auth:
    build:
      context: ..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: bench-auth
    ports:
      - "18989:8989"
    volumes:
      - ./etc/auth.yaml:/app/etc/auth.yaml:ro
      - bench_auth_log:/app/log
    depends_on:
      bench-auth-migrate:
        condition: service_completed_successfully
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-rocketmq-proxy:
        condition: service_started
      bench-rocketmq-init:
        condition: service_completed_successfully
      bench-etcd:
        condition: service_healthy

      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-auth-migrate:
    image: postgres:17-alpine
    container_name: bench-auth-migrate
    depends_on:
      bench-postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: bench-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpassword
      AIM_DATABASE: aim_auth
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../app/auth/rpc/model/migrations:/migrations:ro
      - ../deploy/scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - bench-network

  bench-gateway:
    build:
      context: ..
      dockerfile: app/gateway/Dockerfile
    container_name: bench-gateway
    ports:
      - "18888:8888"   # REST API (+10000)
      - "19091:9091"   # gRPC   (+10000)
    environment:
      AIM_GATEWAY_NODE_ID: 0
    volumes:
      - ./etc/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - bench_gateway_log:/app/log
    depends_on:
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-rocketmq-proxy:
        condition: service_started
      bench-rocketmq-init:
        condition: service_completed_successfully
      bench-etcd:
        condition: service_healthy

      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-logic:
    build:
      context: ..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: bench-logic
    expose:
      - "19194"  # Prometheus metrics
    volumes:
      - ./etc/logic.yaml:/app/etc/logic.yaml:ro
      - bench_logic_log:/app/log
    depends_on:
      bench-logic-migrate:
        condition: service_completed_successfully
      bench-redis:
        condition: service_healthy
      bench-rocketmq-proxy:
        condition: service_started
      bench-rocketmq-init:
        condition: service_completed_successfully
      bench-etcd:
        condition: service_healthy

      bench-tempo:
        condition: service_started
    networks:
      - bench-network

  bench-logic-migrate:
    image: postgres:17-alpine
    container_name: bench-logic-migrate
    depends_on:
      bench-postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: bench-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpassword
      AIM_DATABASE: aim_logic
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../app/logic/rpc/model/migrations:/migrations:ro
      - ../deploy/scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - bench-network

  bench-core:
    build:
      context: ..
      dockerfile: app/core/rpc/Dockerfile
    container_name: bench-core
    ports:
      - "18081:8080"
    expose:
      - "19193"  # Prometheus metrics
    volumes:
      - ./etc/core.yaml:/app/etc/core.yaml:ro
      - bench_core_log:/app/log
    depends_on:
      bench-redis:
        condition: service_healthy
      bench-postgres:
        condition: service_healthy
      bench-rocketmq-proxy:
        condition: service_started
      bench-rocketmq-init:
        condition: service_completed_successfully
      bench-etcd:
        condition: service_healthy

      bench-tempo:
        condition: service_started
      bench-logic:
        condition: service_started
    networks:
      - bench-network

  # ==================== Data Stores ====================

  bench-postgres:
    image: postgres:17-alpine
    container_name: bench-postgres
    environment:
      POSTGRES_USER: benchuser
      POSTGRES_PASSWORD: benchpassword
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - bench_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: bench-redis
    ports:
      - "16379:6379"
    volumes:
      - bench_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  bench-rocketmq-namesrv:
    image: apache/rocketmq:5.3.3
    container_name: bench-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    expose:
      - "9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - bench-network

  bench-rocketmq-broker:
    image: apache/rocketmq:5.3.3
    container_name: bench-rocketmq-broker
    command: ["sh", "mqbroker", "-n", "bench-rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    expose:
      - "10909"
      - "10911"
      - "10912"
    # Named volumes are root-owned; the broker must write its store as root.
    user: "0:0"
    volumes:
      - ../deploy/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - bench_rocketmq_broker_store:/home/rocketmq/store
    depends_on:
      bench-rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n bench-rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - bench-network

  bench-rocketmq-proxy:
    image: apache/rocketmq:5.3.3
    container_name: bench-rocketmq-proxy
    command: ["sh", "mqproxy", "-n", "bench-rocketmq-namesrv:9876"]
    expose:
      - "8080"
      - "8081"
    ports:
      - "18082:8081"
    depends_on:
      bench-rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - bench-network

  bench-rocketmq-dashboard:
    container_name: bench-rocketmq-dashboard
    image: apacherocketmq/rocketmq-dashboard:latest
    ports:
      - 18000:8080
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=bench-rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    depends_on:
      bench-rocketmq-namesrv:
        condition: service_healthy
    networks:
      - bench-network

  bench-rocketmq-init:
    image: apache/rocketmq:5.3.3
    container_name: bench-rocketmq-init
    depends_on:
      bench-rocketmq-broker:
        condition: service_healthy
    environment:
      ROCKETMQ_NAMESRV: bench-rocketmq-namesrv:9876
      ROCKETMQ_CLUSTER: DefaultCluster
      ROCKETMQ_QUEUES: 4
    volumes:
      - ../deploy/scripts/init-rocketmq-topics.sh:/scripts/init-rocketmq-topics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-rocketmq-topics.sh"]
    restart: "no"
    networks:
      - bench-network

  bench-etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: bench-etcd
    command:
      - etcd
      - --name=bench-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://bench-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://bench-etcd:2380
      - --initial-cluster=bench-etcd=http://bench-etcd:2380
    ports:
      - "12379:2379"
      - "12380:2380"
    volumes:
      - bench_etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bench-network

  # ==================== Observability ====================

  bench-tempo:
    image: grafana/tempo:2.8.1
    container_name: bench-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    ports:
      - "13200:3200"     # Tempo HTTP API / Grafana datasource (+10000)
      - "14317:4317"     # OTLP gRPC (+10000)
      - "14318:4318"     # OTLP HTTP (+10000)
    volumes:
      - ../deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - bench_tempo_data:/var/tempo
    networks:
      bench-network:
        aliases:
          - tempo

  bench-prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - bench_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    networks:
      bench-network:
        aliases:
          - prometheus

  bench-loki:
    image: grafana/loki:latest
    container_name: bench-loki
    ports:
      - "13100:3100"
    volumes:
      - ../deploy/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - bench_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      bench-network:
        aliases:
          - loki

  bench-promtail:
    image: grafana/promtail:latest
    container_name: bench-promtail
    volumes:
      - ../deploy/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - bench-network

  bench-grafana:
    image: grafana/grafana:latest
    container_name: bench-grafana
    ports:
      - "13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - bench_grafana_data:/var/lib/grafana
    networks:
      - bench-network

networks:
  bench-network:
    driver: bridge

volumes:
  bench_postgres_data:
  bench_redis_data:
  bench_rocketmq_broker_store:
  bench_etcd_data:
  bench_gateway_log:

  bench_auth_log:
  bench_logic_log:
  bench_core_log:
  bench_prometheus_data:
  bench_loki_data:
  bench_grafana_data:
  bench_tempo_data:
