# ======================================================
# kafbat-ui 本地开发配置
# 本地 Kafka（PLAINTEXT，无 SSL/SASL），无 ksqlDB / Connect / Auth
# ======================================================
kafka:
  clusters:
    - name: local
      bootstrap-servers: kafka:9092
      read-only: false

      # 本地 Kafka 无认证，使用默认 PLAINTEXT
      properties: {}

      metrics:
        type: JMX
        port: 9997
        ssl: false

  internalTopicPrefix: "__"
  admin-client-timeout: 30000

  polling:
    poll-timeout-ms: 1000
    max-page-size: 500
    default-page-size: 100

# ======================================================
# 日志
# ======================================================
logging:
  level:
    root: INFO
    io.kafbat.ui: DEBUG
    reactor.netty.http.server.AccessLog: INFO
