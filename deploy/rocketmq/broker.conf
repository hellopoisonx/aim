# RocketMQ broker configuration for the local AIM stack.
#
# A single broker with async flush is enough for development: messages are still
# written to the page cache synchronously, and every AIM event consumer tolerates
# redelivery. Production deployments override this file.

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
diskMaxUsedSpaceRatio = 88

# The gRPC proxy resolves the broker through the name server, so the advertised
# address must be the compose service name rather than the container IP.
brokerIP1 = rocketmq-broker
listenPort = 10911

# AIM declares its consumer and producer groups from init-rocketmq-topics.sh; the
# broker must not reject groups it has never seen.
autoCreateTopicEnable = false
autoCreateSubscriptionGroup = true

# Transactional messages (outbox replacement) need the check-back path enabled.
transactionCheckInterval = 6000
transactionTimeOut = 6000

# Keep FIFO (ordered) delivery per message group portable across composes.
defaultTopicQueueNums = 4

# ACL is intentionally disabled: the proxy and broker only listen on the compose
# network, and no credentials are configured in the service yaml files.
aclEnable = false
