server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(aim-.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: aim-(.*)
        target_label: service
        replacement: $1
      - source_labels: [__meta_docker_container_name]
        regex: /(aim-.*)
        action: keep
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            content: content
            timestamp: '["@timestamp"]'
            caller: caller
            trace: trace
            span: span
            duration: duration
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          service:
