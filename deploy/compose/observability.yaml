x-aim-env-file: &aim-env-file
  - ${AIM_ENV_FILE:-../env/local.env}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aim-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - aim-network

  loki:
    image: grafana/loki:latest
    container_name: aim-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - aim-network

  promtail:
    image: grafana/promtail:latest
    container_name: aim-promtail
    volumes:
      - ../promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - aim-network

  grafana:
    image: grafana/grafana:latest
    container_name: aim-grafana
    env_file: *aim-env-file
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - aim-network

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
