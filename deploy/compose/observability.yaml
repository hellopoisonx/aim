x-aim-env-file: &aim-env-file
  - ${AIM_ENV_FILE:-../env/local.env}

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aim-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - aim-network

  loki:
    image: grafana/loki:latest
    container_name: aim-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - aim-network

  promtail:
    image: grafana/promtail:latest
    container_name: aim-promtail
    volumes:
      - ../promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - aim-network

  grafana:
    image: grafana/grafana:latest
    container_name: aim-grafana
    env_file: *aim-env-file
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - aim-network

  # ==================== Infrastructure Exporters ====================

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: aim-postgres-exporter
    env_file: *aim-env-file
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aim-network

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: aim-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aim-network

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: aim-kafka-exporter
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    expose:
      - "9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - aim-network

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
