x-aim-env-file: &aim-env-file
  - ${AIM_ENV_FILE:-../env/local.env}

services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: ../..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-auth
    expose:
      - "8989"
      - "9192"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-auth-migrate
    env_file: *aim-env-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIM_DATABASE: aim_auth
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../app/auth/rpc/model/migrations:/migrations:ro
      - ../scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-gateway:
    build:
      context: ../..
      dockerfile: app/gateway/Dockerfile
    container_name: aim-gateway
    environment:
      AIM_GATEWAY_NODE_ID: ${AIM_GATEWAY_NODE_ID:-0}
    expose:
      - "8888"  # REST API / WebSocket
      - "9091"  # internal GatewayService gRPC
      - "9191"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      tempo:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-logic:
    build:
      context: ../..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: aim-logic
    expose:
      - "8082"
      - "9194"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/logic.yaml:/app/etc/logic.yaml:ro
      - logic_log:/app/log
    depends_on:
      logic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - aim-network

  logic-migrate:
    image: postgres:17-alpine
    container_name: aim-logic-migrate
    env_file: *aim-env-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIM_DATABASE: aim_logic
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../app/logic/rpc/model/migrations:/migrations:ro
      - ../scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-core:
    build:
      context: ../..
      dockerfile: app/core/rpc/Dockerfile
    container_name: aim-core
    expose:
      - "8080"
      - "9193"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/core.yaml:/app/etc/core.yaml:ro
      - core_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      tempo:
        condition: service_started
      aim-logic:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network

  aim-attachment:
    build:
      context: ../..
      dockerfile: app/attachment/Dockerfile
    container_name: aim-attachment
    expose:
      - "8091"  # internal-only gRPC
      - "9195"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/attachment.yaml:/app/etc/attachment.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-data-parsing:
    build:
      context: ../..
      dockerfile: app/data_parsing/Dockerfile
    container_name: aim-data-parsing
    expose:
      - "9196"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/data_parsing.yaml:/app/etc/data_parsing.yaml:ro
    depends_on:
      aim-attachment:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-postgres
    env_file: *aim-env-file
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  kafka:
    image: apache/kafka:4.0.2
    container_name: aim-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    expose:
      - "9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aim-network

  kafka-init:
    image: apache/kafka:4.0.2
    container_name: aim-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
    volumes:
      - ../scripts/init-kafka-topics.sh:/scripts/init-kafka-topics.sh:ro
    command: ["/bin/sh", "/scripts/init-kafka-topics.sh"]
    networks:
      - aim-network

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: aim-nacos
    env_file: *aim-env-file
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    expose:
      - "8848"
      - "9848"
      - "9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Object Storage ====================

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-master
    command: "master -ip=seaweed-master -mdir=/data"
    expose:
      - "9333"
    volumes:
      - seaweed_master_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-volume
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    expose:
      - "8080"
    volumes:
      - seaweed_volume_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-filer
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    expose:
      - "8888"
    volumes:
      - seaweed_filer_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-s3
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0 -port=8333 -iam=false -config=/etc/seaweedfs/s3.json"
    depends_on:
      - seaweed-filer
    expose:
      - "8333"
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - aim-network
      - aim_shared

  seaweed-bucket-init:
    image: amazon/aws-cli:latest
    container_name: aim-seaweed-bucket-init
    env_file: *aim-env-file
    depends_on:
      - seaweed-s3
    volumes:
      - ../scripts/init-seaweed-bucket.sh:/scripts/init-seaweed-bucket.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-seaweed-bucket.sh"]
    networks:
      - aim-network

  # ==================== Required tracing backend ====================

  tempo:
    image: grafana/tempo:2.8.1
    container_name: aim-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    expose:
      - "3200"  # Tempo HTTP API / Grafana datasource
      - "4317"  # OTLP gRPC receiver
      - "4318"  # OTLP HTTP receiver
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge
  aim_shared:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  nacos_data:
  nacos_logs:
  gateway_log:
  auth_log:
  logic_log:
  core_log:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  tempo_data:
