x-aim-env-file: &aim-env-file
  - ${AIM_ENV_FILE:-../env/local.env}

services:
  # ==================== AIM Services ====================

  aim-auth:
    build:
      context: ../..
      dockerfile: app/auth/rpc/Dockerfile
    container_name: aim-auth
    expose:
      - "8989"
      - "9192"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/auth.yaml:/app/etc/auth.yaml:ro
      - auth_log:/app/log
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy

      tempo:
        condition: service_started
    networks:
      - aim-network

  auth-migrate:
    image: postgres:17-alpine
    container_name: aim-auth-migrate
    env_file: *aim-env-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIM_DATABASE: aim_auth
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../app/auth/rpc/model/migrations:/migrations:ro
      - ../scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-gateway:
    build:
      context: ../..
      dockerfile: app/gateway/Dockerfile
    container_name: aim-gateway
    environment:
      AIM_GATEWAY_NODE_ID: ${AIM_GATEWAY_NODE_ID:-0}
    expose:
      - "8888"  # REST API / WebSocket
      - "9091"  # internal GatewayService gRPC
      - "9191"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/gateway-api.yaml:/app/etc/gateway-api.yaml:ro
      - gateway_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy

      tempo:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-logic:
    build:
      context: ../..
      dockerfile: app/logic/rpc/Dockerfile
    container_name: aim-logic
    expose:
      - "8082"
      - "9194"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/logic.yaml:/app/etc/logic.yaml:ro
      - logic_log:/app/log
    depends_on:
      logic-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy

      tempo:
        condition: service_started
    networks:
      - aim-network

  logic-migrate:
    image: postgres:17-alpine
    container_name: aim-logic-migrate
    env_file: *aim-env-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIM_DATABASE: aim_logic
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../app/logic/rpc/model/migrations:/migrations:ro
      - ../scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  attachment-migrate:
    image: postgres:17-alpine
    container_name: aim-attachment-migrate
    env_file: *aim-env-file
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIM_DATABASE: aim_attachment
      AIM_MIGRATIONS_DIR: /migrations
    volumes:
      - ../../app/attachment/model/migrations:/migrations:ro
      - ../scripts/migrate-postgres.sh:/scripts/migrate-postgres.sh:ro
    command: ["/bin/sh", "/scripts/migrate-postgres.sh"]
    networks:
      - aim-network

  aim-core:
    build:
      context: ../..
      dockerfile: app/core/rpc/Dockerfile
    container_name: aim-core
    expose:
      - "8080"
      - "9193"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/core.yaml:/app/etc/core.yaml:ro
      - core_log:/app/log
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy

      tempo:
        condition: service_started
      aim-logic:
        condition: service_started
      aim-attachment:
        condition: service_started
    networks:
      - aim-network

  aim-attachment:
    build:
      context: ../..
      dockerfile: app/attachment/Dockerfile
    container_name: aim-attachment
    expose:
      - "8091"  # internal-only gRPC
      - "9195"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/attachment.yaml:/app/etc/attachment.yaml:ro
    depends_on:
      attachment-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network
      - aim_shared

  aim-data-parsing:
    build:
      context: ../..
      dockerfile: app/data_parsing/Dockerfile
    container_name: aim-data-parsing
    expose:
      - "9196"  # Prometheus metrics
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/data_parsing.yaml:/app/etc/data_parsing.yaml:ro
    depends_on:
      aim-attachment:
        condition: service_started
      rocketmq-proxy:
        condition: service_started
      rocketmq-init:
        condition: service_completed_successfully
      seaweed-s3:
        condition: service_started
      seaweed-bucket-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    networks:
      - aim-network

  # ==================== Data Stores ====================

  postgres:
    image: postgres:17-alpine
    container_name: aim-postgres
    env_file: *aim-env-file
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    container_name: aim-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Message Queue (RocketMQ 5) ====================
  # The gRPC proxy is what the Go SDK talks to; the broker and name server are
  # the storage layer behind it. Clients publish to rocketmq-proxy:8081.

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.3
    container_name: aim-rocketmq-namesrv
    command: ["sh", "mqnamesrv"]
    expose:
      - "9876"
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - aim-network

  rocketmq-broker:
    image: apache/rocketmq:5.3.3
    container_name: aim-rocketmq-broker
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    expose:
      - "10909"
      - "10911"
      - "10912"
    # Docker creates named volumes owned by root, while the image runs as the
    # `rocketmq` user; run the broker as root so it can write its store.
    user: "0:0"
    volumes:
      - ../rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_broker_store:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - aim-network

  rocketmq-proxy:
    image: apache/rocketmq:5.3.3
    container_name: aim-rocketmq-proxy
    command: ["sh", "mqproxy", "-n", "rocketmq-namesrv:9876"]
    expose:
      - "8080"  # proxy HTTP
      - "8081"  # proxy gRPC (the Go SDK endpoint)
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - aim-network

  rocketmq-init:
    image: apache/rocketmq:5.3.3
    container_name: aim-rocketmq-init
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    environment:
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      ROCKETMQ_CLUSTER: DefaultCluster
      ROCKETMQ_QUEUES: 4
    volumes:
      - ../scripts/init-rocketmq-topics.sh:/scripts/init-rocketmq-topics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-rocketmq-topics.sh"]
    restart: "no"
    networks:
      - aim-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: aim-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    expose:
      - "2379"
      - "2380"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aim-network

  # ==================== Object Storage ====================

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-master
    command: "master -ip=seaweed-master -mdir=/data"
    expose:
      - "9333"
    volumes:
      - seaweed_master_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-volume
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -dir=/data -max=0"
    depends_on:
      - seaweed-master
    expose:
      - "8080"
    volumes:
      - seaweed_volume_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-filer
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    depends_on:
      - seaweed-master
      - seaweed-volume
    expose:
      - "8888"
    volumes:
      - seaweed_filer_data:/data
    networks:
      - aim-network
      - aim_shared

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: aim-seaweed-s3
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0 -port=8333 -iam=false -config=/etc/seaweedfs/s3.json"
    depends_on:
      - seaweed-filer
    expose:
      - "8333"
    volumes:
      - ${AIM_CONFIG_DIR:-../config/local}/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - aim-network
      - aim_shared

  seaweed-bucket-init:
    image: amazon/aws-cli:latest
    container_name: aim-seaweed-bucket-init
    env_file: *aim-env-file
    depends_on:
      - seaweed-s3
    volumes:
      - ../scripts/init-seaweed-bucket.sh:/scripts/init-seaweed-bucket.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-seaweed-bucket.sh"]
    networks:
      - aim-network

  # ==================== Required tracing backend ====================

  tempo:
    image: grafana/tempo:2.8.1
    container_name: aim-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    expose:
      - "3200"  # Tempo HTTP API / Grafana datasource
      - "4317"  # OTLP gRPC receiver
      - "4318"  # OTLP HTTP receiver
    volumes:
      - ../tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - aim-network

networks:
  aim-network:
    driver: bridge
  aim_shared:
    driver: bridge

volumes:
  rocketmq_broker_store:
  postgres_data:
  redis_data:
  etcd_data:
  gateway_log:
  auth_log:
  logic_log:
  core_log:
  seaweed_master_data:
  seaweed_volume_data:
  seaweed_filer_data:
  tempo_data:
