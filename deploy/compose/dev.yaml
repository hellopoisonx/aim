services:
  aim-auth:
    ports:
      - "127.0.0.1:8989:8989"

  aim-gateway:
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9091:9091"

  aim-core:
    ports:
      # 8081 belongs to the RocketMQ gRPC proxy on the host.
      - "127.0.0.1:8085:8080"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # Host-side access for `go run` of a single service and for mqadmin:
  # the proxy gRPC endpoint (8081) and the name server (9876).
  rocketmq-proxy:
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8080:8080"

  rocketmq-namesrv:
    ports:
      - "127.0.0.1:9876:9876"

  rocketmq-broker:
    ports:
      - "127.0.0.1:10911:10911"

  etcd:
    ports:
      - "127.0.0.1:2379:2379"
      - "127.0.0.1:2380:2380"

  seaweed-master:
    ports:
      - "127.0.0.1:9333:9333"

  seaweed-volume:
    ports:
      - "127.0.0.1:8088:8080"

  seaweed-filer:
    ports:
      - "127.0.0.1:8889:8888"

  seaweed-s3:
    ports:
      - "127.0.0.1:8333:8333"

  tempo:
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  postgres-exporter:
    ports:
      - "127.0.0.1:9187:9187"

  redis-exporter:
    ports:
      - "127.0.0.1:9121:9121"
