global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ────────────────── AIM Go Services ──────────────────
  - job_name: "aim-gateway"
    static_configs:
      - targets: ["aim-gateway:9191"]

  - job_name: "aim-auth"
    static_configs:
      - targets: ["aim-auth:9192"]

  - job_name: "aim-core"
    static_configs:
      - targets: ["aim-core:9193"]

  - job_name: "aim-logic"
    static_configs:
      - targets: ["aim-logic:9194"]

  - job_name: "aim-attachment"
    static_configs:
      - targets: ["aim-attachment:9195"]

  - job_name: "aim-data-parsing"
    static_configs:
      - targets: ["aim-data-parsing:9196"]

  # ────────────────── Data Stores ──────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["aim-postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["aim-redis-exporter:9121"]

  - job_name: "kafka"
    static_configs:
      - targets: ["aim-kafka-exporter:9308"]

  # ────────────────── Service Discovery ──────────────────
  # etcd 自带 Prometheus 指标在 /metrics 端点；非集群环境可视需要启用。
  # - job_name: "etcd"
  #   static_configs:
  #     - targets: ["etcd:2379"]


  # ────────────────── Object Storage ──────────────────
  - job_name: "seaweed-master"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["seaweed-master:9333"]

  - job_name: "seaweed-volume"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["seaweed-volume:8080"]

  - job_name: "seaweed-filer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["seaweed-filer:8888"]

  # ────────────────── Observability Self-Monitoring ──────────────────
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
