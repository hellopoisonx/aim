global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aim-gateway"
    static_configs:
      - targets: ["aim-gateway:9191"]

  - job_name: "aim-auth"
    static_configs:
      - targets: ["aim-auth:9192"]

  - job_name: "aim-core"
    static_configs:
      - targets: ["aim-core:9193"]

  - job_name: "aim-logic"
    static_configs:
      - targets: ["aim-logic:9194"]

  - job_name: "aim-attachment"
    static_configs:
      - targets: ["aim-attachment:9195"]

  - job_name: "aim-data-parsing"
    static_configs:
      - targets: ["aim-data-parsing:9196"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
