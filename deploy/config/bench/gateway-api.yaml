  ReadLimit: 32768
  WriteLimit: 32768
  PongWait: 30
  PingPeriod: 15
  MaxMsgSize: 1024
  ServerAckDelay: 5
  HeartbeatInterv: 30
Redis:
  Addr: bench-redis:6379
  Password: ""
  DB: 0
  PresenceTTL: 45
Kafka:
  Brokers:
    - bench-kafka:9092
  PresenceTopic: aim.presence.events
  TypingTopic: aim.typing.events
  ReadReceiptTopic: aim.read_receipt.events
GatewayRpc:
  Name: gateway.rpc
  ListenOn: 0.0.0.0:9091
