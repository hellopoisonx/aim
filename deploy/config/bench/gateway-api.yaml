  Port: 19191
  Path: /metrics
Telemetry:
  Name: gateway-api
  Endpoint: bench-tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
AuthRpc:
  ServerAddr: bench-nacos:8848
  NamespaceID: ""
  Group: DEFAULT_GROUP
  Cluster: DEFAULT
  ServiceName: auth.rpc
  AdvertiseIP: ""
