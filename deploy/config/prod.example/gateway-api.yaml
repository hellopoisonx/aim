Name: gateway-api
Host: 0.0.0.0
Port: 8888
Prometheus:
  Host: 0.0.0.0
  Port: 9191
  Path: /metrics
Telemetry:
  Name: gateway-api
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
AuthRpc:
  Etcd:
    Hosts:
      - CHANGE_ME_ETCD_HOST_1:2379
      - CHANGE_ME_ETCD_HOST_2:2379
      - CHANGE_ME_ETCD_HOST_3:2379
    Key: auth.rpc
    # 生产建议开启 etcd 鉴权；未开启可删除以下 5 行。
    User: CHANGE_ME_ETCD_USER
    Pass: CHANGE_ME_ETCD_PASSWORD
    CertFile: CHANGE_ME_ETCD_CERT_FILE
    CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
    CACertFile: CHANGE_ME_ETCD_CA_FILE
CoreRpc:
  Etcd:
    Hosts:
      - CHANGE_ME_ETCD_HOST_1:2379
      - CHANGE_ME_ETCD_HOST_2:2379
      - CHANGE_ME_ETCD_HOST_3:2379
    Key: core.rpc
    # 生产建议开启 etcd 鉴权；未开启可删除以下 5 行。
    User: CHANGE_ME_ETCD_USER
    Pass: CHANGE_ME_ETCD_PASSWORD
    CertFile: CHANGE_ME_ETCD_CERT_FILE
    CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
    CACertFile: CHANGE_ME_ETCD_CA_FILE
LogicRpc:
  Etcd:
    Hosts:
      - CHANGE_ME_ETCD_HOST_1:2379
      - CHANGE_ME_ETCD_HOST_2:2379
      - CHANGE_ME_ETCD_HOST_3:2379
    Key: logic.rpc
    # 生产建议开启 etcd 鉴权；未开启可删除以下 5 行。
    User: CHANGE_ME_ETCD_USER
    Pass: CHANGE_ME_ETCD_PASSWORD
    CertFile: CHANGE_ME_ETCD_CERT_FILE
    CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
    CACertFile: CHANGE_ME_ETCD_CA_FILE
Auth:
  AccessSecret: CHANGE_ME_RANDOM_48_BYTES
WebSocket:
  OriginPatterns: []
  ReadLimit: 32768
  WriteLimit: 32768
  PongWait: 30
  PingPeriod: 15
  MaxMsgSize: 1024
  ServerAckDelay: 5
  HeartbeatInterv: 30
Redis:
  Addr: redis:6379
  Password: ""
  DB: 0
  PresenceTTL: 45
Kafka:
  Brokers:
    - kafka:9092
  PresenceTopic: aim.presence.events
  TypingTopic: aim.typing.events
  ReadReceiptTopic: aim.read_receipt.events
AttachmentRpc:
  Etcd:
    Hosts:
      - CHANGE_ME_ETCD_HOST_1:2379
      - CHANGE_ME_ETCD_HOST_2:2379
      - CHANGE_ME_ETCD_HOST_3:2379
    Key: attachment.rpc
    # 生产建议开启 etcd 鉴权；未开启可删除以下 5 行。
    User: CHANGE_ME_ETCD_USER
    Pass: CHANGE_ME_ETCD_PASSWORD
    CertFile: CHANGE_ME_ETCD_CERT_FILE
    CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
    CACertFile: CHANGE_ME_ETCD_CA_FILE
# Gateway 进程同时启动 REST 与内部 GatewayRpc。go-zero Prometheus agent
# 在同一进程内通过 sync.Once 只启动一次，因此 REST/GatewayRpc 共用 9191。
GatewayRpc:
  Name: gateway.rpc
  ListenOn: 0.0.0.0:9091
  Etcd:
    Hosts:
      - CHANGE_ME_ETCD_HOST_1:2379
      - CHANGE_ME_ETCD_HOST_2:2379
      - CHANGE_ME_ETCD_HOST_3:2379
    Key: gateway.rpc
    # 生产建议开启 etcd 鉴权；未开启可删除以下 5 行。
    User: CHANGE_ME_ETCD_USER
    Pass: CHANGE_ME_ETCD_PASSWORD
    CertFile: CHANGE_ME_ETCD_CERT_FILE
    CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
    CACertFile: CHANGE_ME_ETCD_CA_FILE
  Prometheus:
    Host: 0.0.0.0
    Port: 9191
    Path: /metrics
  Telemetry:
    Name: gateway.rpc
    Endpoint: tempo:4318
    Sampler: 1.0
    Batcher: otlphttp
    OtlpHttpPath: /v1/traces

# Per-(device_id, user_id) sliding-window rate limit applied to all
# human-authenticated REST endpoints. MaxRequests <= 0 disables the
# limiter.
RateLimitQuota:
  WindowSeconds: 60
  MaxRequests: 100
# Per-TokenID sliding-window rate limit applied to /api/bot/v1/messages.
BotRateLimitQuota:
  WindowSeconds: 60
  MaxRequests: 100
