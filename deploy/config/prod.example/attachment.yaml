Name: attachment.rpc
ListenOn: 0.0.0.0:8091
Prometheus:
  Host: 0.0.0.0
  Port: 9195
  Path: /metrics
Telemetry:
  Name: attachment.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - CHANGE_ME_ETCD_HOST_1:2379
    - CHANGE_ME_ETCD_HOST_2:2379
    - CHANGE_ME_ETCD_HOST_3:2379
  Key: attachment.rpc
  # 生产建议开启 etcd 鉴权，凭证从环境变量 / Secret 注入；未开启可删除以下 5 行。
  User: CHANGE_ME_ETCD_USER
  Pass: CHANGE_ME_ETCD_PASSWORD
  CertFile: CHANGE_ME_ETCD_CERT_FILE
  CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
  CACertFile: CHANGE_ME_ETCD_CA_FILE
Postgres:
  DataSource: postgres://aim_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/aim_logic?sslmode=disable
Seaweed:
  Endpoint: http://seaweed-s3:8333
  PublicEndpoint: https://CHANGE_ME_FILES_DOMAIN
  Region: us-east-1
  Bucket: aim-attachments
  AccessKey: aim-prod
  SecretKey: CHANGE_ME_SEAWEED_SECRET_KEY
  PresignTTL: 900
  DownloadTTL: 300
  MaxSizeBytes: 5368709120
Kafka:
  Brokers:
    - kafka:9092
  Topic: aim.attachment.uploaded
