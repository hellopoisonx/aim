Name: auth.rpc
ListenOn: 0.0.0.0:8989
Prometheus:
  Host: 0.0.0.0
  Port: 9192
  Path: /metrics
Telemetry:
  Name: auth.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Nacos:
  ServerAddr: nacos:8848
  NamespaceID: ""
  Group: DEFAULT_GROUP
  Cluster: DEFAULT
  ServiceName: auth.rpc
  AdvertiseIP: aim-auth
  AdvertisePort: 8989
  Ephemeral: true
  Weight: 1
  TimeoutMs: 5000
  Username: "nacos"
  Password: "CHANGE_ME_NACOS_PASSWORD"
  LogDir: /app/log/nacos
  CacheDir: /tmp/nacos/cache
  LogLevel: info
Postgres:
  DataSource: postgres://aim_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/aim_auth?sslmode=disable
SessionRedis:
  Host: redis:6379
  Pass: ""
Token:
  AccessSecret: CHANGE_ME_RANDOM_48_BYTES
  AccessTTL: 5m
  RefreshTTL: 168h
  SnowflakeMachineID: 1
KqPusherConf:
  Brokers:
    - kafka:9092
  Topic: aim.user.events
