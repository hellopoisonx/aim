Name: auth.rpc
ListenOn: 0.0.0.0:8989
Prometheus:
  Host: 0.0.0.0
  Port: 9192
  Path: /metrics
Telemetry:
  Name: auth.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - CHANGE_ME_ETCD_HOST_1:2379
    - CHANGE_ME_ETCD_HOST_2:2379
    - CHANGE_ME_ETCD_HOST_3:2379
  Key: auth.rpc
  # 生产建议开启 etcd 鉴权，凭证从环境变量 / Secret 注入；未开启可删除以下 5 行。
  User: CHANGE_ME_ETCD_USER
  Pass: CHANGE_ME_ETCD_PASSWORD
  CertFile: CHANGE_ME_ETCD_CERT_FILE
  CertKeyFile: CHANGE_ME_ETCD_KEY_FILE
  CACertFile: CHANGE_ME_ETCD_CA_FILE
Postgres:
  DataSource: postgres://aim_user:CHANGE_ME_POSTGRES_PASSWORD@postgres:5432/aim_auth?sslmode=disable
SessionRedis:
  Host: redis:6379
  Pass: ""
Token:
  AccessSecret: CHANGE_ME_RANDOM_48_BYTES
  AccessTTL: 5m
  RefreshTTL: 168h
  SnowflakeMachineID: 1
KqPusherConf:
  Brokers:
    - kafka:9092
  Topic: aim.user.events
