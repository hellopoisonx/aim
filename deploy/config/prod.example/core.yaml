Name: core.rpc
ListenOn: 0.0.0.0:8080
Prometheus:
  Host: 0.0.0.0
  Port: 9193
  Path: /metrics
Telemetry:
  Name: core.rpc
  Endpoint: tempo:4318
  Sampler: 1.0
  Batcher: otlphttp
  OtlpHttpPath: /v1/traces
Etcd:
  Hosts:
    - etcd:2379
  Key: core.rpc
SnowflakeMachineID: 1
CacheRedis:
  Addr: redis:6379
  Password: ""
  DB: 0
LogicRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: logic.rpc
KqPusherConf:
  Brokers:
    - kafka:9092
  Topic: aim-message-transfer
KqConsumerConf:
  Name: core-delivery-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-delivery
  Topic: aim-message-transfer
  Offset: first
  Consumers: 1
  Processors: 1
PresenceConsumerConf:
  Name: core-presence-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-presence
  Topic: aim.presence.events
  Offset: first
  Consumers: 1
  Processors: 1
TypingConsumerConf:
  Name: core-typing-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-typing
  Topic: aim.typing.events
  Offset: first
  Consumers: 1
  Processors: 1
ReadReceiptConsumerConf:
  Name: core-read-receipt-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-read-receipt
  Topic: aim.read_receipt.events
  Offset: first
  Consumers: 1
  Processors: 1
# 群管理系统消息消费者：消费 logic 发布的群变更事件并推送到目标用户所在 Gateway。
ConversationEventConsumerConf:
  Name: core-conversation-event-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-conversation-events
  Topic: aim.conversation.events
  Offset: first
  Consumers: 1
  Processors: 1
# 附件解析完成消费者：消费 data_parsing 发布的 aim.attachment.parsed 事件，
# 将解析结果（缩略图、尺寸等）以系统消息推送至会话成员。
AttachmentParsedConsumerConf:
  Name: core-attachment-parsed-consumer
  Brokers:
    - kafka:9092
  Group: aim-core-attachment-parsed
  Topic: aim.attachment.parsed
  Offset: first
  Consumers: 1
  Processors: 1
GatewayRpc:
  ServiceName: gateway.rpc
  Target: aim-gateway:9091
AttachmentRpc:
  Etcd:
    Hosts:
      - etcd:2379
    Key: attachment.rpc
Presence:
  TTLSeconds: 30
