run:
  timeout: 5m
  # 包含测试文件
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - iface
    - mirror
    - wsl_v5
    - usetesting
    - goconst
    - gocyclo
    - gosec
    - modernize
    - testifylint
  settings:
    goconst:
      ignore-tests: true
  exclusions:
    rules:
      # go-zero 配置结构使用 json tag option 表达默认值/可选项，这是框架约定。
      - linters:
          - staticcheck
        text: "SA5008: (invalid appearance of unknown `.*` tag option|malformed `json` tag:)"
        path: "app/.*/internal/config/config.go"

issues:
  # 不限制每类问题的数量
  max-issues-per-linter: 0
  max-same-issues: 0

  # 仅针对新修改的代码进行检查（如果是存量项目，建议开启）
  # new-from-rev: HEAD~1

version: "2"
