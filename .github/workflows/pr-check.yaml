# 触发: 任何 PR + main 分支推送
# 作用:
#   1. 编译 + 单元测试 + 覆盖率软门禁 (不含 docker, 3-5 分钟)
#   2. .golangci.yaml lint
#   3. goctl api go 重生成 + git diff (守住 gateway.api 契约)
#   4. Postgres 集成套件 (另外起一个 job, 见文件末尾)
name: PR Check

on:
  pull_request:
  push:
    branches: [main]

# 同一 PR 反复 push 时, 自动取消旧的 in-progress run, 节省 CI 资源
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./app/... ./shared/... ./bot_sdk/...

      # AGENTS.md 要求 "代码更改后必须执行测试、覆盖率测试、lint"
      # coverage 软门禁: < 50% 时仅 ::warning::, 不阻断 PR
      # 等项目覆盖率基线稳定后再考虑升级为 hard-fail
      #
      # 分母只保留手写代码: proto 桩 (app/*/rpc/pb, shared/proto/*/pb) 按设计
      # 没有测试, 但会以 0% 进入 profile, 把 ~17k 行生成代码算进分母。
      # 生成代码留在分母里会让门禁既无法达标, 也对真实缺口不敏感。
      # (goctl 生成的 internal/types 只有结构体声明, 没有语句, 本来就不入 profile。)
      - name: Test (with coverage)
        run: |
          mkdir -p coverage
          go test -coverprofile=coverage/coverage.out ./app/... ./shared/... ./bot_sdk/...
          grep -vE '/pb/' coverage/coverage.out > coverage/handwritten.out
          total=$(go tool cover -func=coverage/handwritten.out | tail -1)
          echo "手写代码覆盖率: $total"
          pct=$(echo "$total" | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          if awk -v p="$pct" 'BEGIN { exit !(p+0 < 50) }'; then
            echo "::warning::手写代码覆盖率 ${pct}% 低于 50% 软门禁"
          else
            echo "✓ 手写代码覆盖率 ${pct}% ≥ 50% 软门禁"
          fi

      # bot_sdk 的 integration 套件用 httptest 起内存网关, 不需要外部服务
      - name: Test bot_sdk integration suite
        run: go test -tags=integration -count=1 ./bot_sdk/...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # 限定 targets 跳过 skills/ (教学资料, 不是产品代码):
      # skills/golang-cli/assets/examples/ 是 cobra/viper 教学示例,
      # import 了本项目不依赖的 cobra/viper/fsnotify, 触发 typecheck 错误
      # v2 的 linters.exclusions.paths 只抑制报告, 不跳过 typecheck 分析,
      # 所以必须在 CLI 层面限定 targets, 让 lint 不加载 skills 目录
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          # 仓库根已有 .golangci.yaml, 不需要 --config
          args: ./app/... ./shared/...

  spec-contract:
    # 守住 gateway.api 契约: 跑 goctl api go 重生成 routes.go,
    # 如果生成结果与提交不一致, CI 失败。
    # 见 plans/gateway-ratelimit-spec-first.md (R2/R3/R4)。
    name: API Spec Contract (gateway.api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要未提交变更以做 diff, 浅克隆够用
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install goctl
        # go-zero 1.10.1+ 支持 middleware: Auth,RateLimit 逗号分隔语法
        # 锁版本与本仓库一致
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          goctl --version

      - name: goctl api validate
        working-directory: app/gateway/api
        run: goctl api validate -api gateway.api

      - name: goctl api go (regenerate)
        working-directory: app/gateway/api
        run: goctl api go -api gateway.api -dir . -style go_zero

      # 期望: goctl 输出与提交完全一致 (.api 是 single source of truth)
      # 若不一致, 说明有人手改 routes.go/types.go 而忘改 .api (或反之)
      # 路径显式列出两个文件, 避免打错目录导致 git 退出码 128
      # (128 会被 `!` 翻成 0 错误地跳过 diff 报错)
      - name: Diff generated handlers/types
        run: |
          if ! git diff --exit-code \
              app/gateway/api/internal/handler/routes.go \
              app/gateway/api/internal/types/types.go 2>&1; then
            echo "::error::routes.go/types.go 与 gateway.api 重新生成结果不一致"
            echo "请重新跑 'cd app/gateway/api && goctl api go -api gateway.api -dir . -style go_zero' 后提交"
            exit 1
          fi
          echo "✓ routes.go / types.go 与 gateway.api 一致"

  integration:
    # 守住 AIM_TEST_POSTGRES_DSN 门控的集成套件 (app/*/model/dao/dao_integration_test.go,
    # app/logic/rpc/integrationtest/, app/shared/attachmentstore/dao, app/shared/gormdb)。
    # 它们验证 fake 无法覆盖的部分 —— JSONB、text[]、部分索引、ON CONFLICT、proto 字段名
    # 与错误码 —— 没有数据库时会静默 skip, 所以必须在这里真跑。
    #
    # 每个服务一个库 (与 deploy/compose/base.yaml 的 aim_auth / aim_logic /
    # aim_attachment 一致): event_journal、outbox_records 等表被多个 migration 集
    # 各自创建, 共库会互相踩。
    #
    # 只起 Postgres: 这些套件不引用 Redis / RocketMQ / etcd (grep 无命中),
    # 起它们只会白占 PR 时间。将来若有套件需要, 在此加 service 即可。
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth DAO
            database: aim_auth
            packages: ./app/auth/rpc/model/dao/...
          - name: logic DAO + gRPC
            database: aim_logic
            packages: ./app/logic/rpc/model/dao/... ./app/logic/rpc/integrationtest/...
          - name: attachment store
            database: aim_attachment
            packages: ./app/shared/attachmentstore/dao/...
          - name: gormdb pool
            database: aim_test
            packages: ./app/shared/gormdb/...
    services:
      postgres:
        # 与部署版本对齐 (deploy/compose/base.yaml), 免得 SQL 特性只在 CI 之外生效
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aim
          POSTGRES_PASSWORD: aim
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aim -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run ${{ matrix.name }} suite
        env:
          AIM_TEST_POSTGRES_DSN: postgres://aim:aim@localhost:5432/${{ matrix.database }}?sslmode=disable
        run: |
          go test -count=1 -p 1 -v ${{ matrix.packages }} 2>&1 | tee integration.log
          # DSN 写错时套件又会退回 skip, 日志里看不出任何变化, 所以显式断言
          if grep -q -- '--- SKIP' integration.log; then
            echo "::error::${{ matrix.name }} 套件被跳过, 检查 AIM_TEST_POSTGRES_DSN 与 Postgres service"
            exit 1
          fi
